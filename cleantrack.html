<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Laundry Manager</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{
  --bg:#f3f6f8;--card:#fff;--ink:#0b1f2a;--ink2:#3c5160;--mute:#6b8090;--line:#e3eaef;--line2:#cfdbe2;
  --brand:#0e7490;--brand-d:#155e75;--brand-s:#e6f6fa;--teal:#14b8a6;
  --red:#dc2626;--red-s:#fef2f2;--amber:#b45309;--amber-s:#fffbeb;--green:#15803d;--green-s:#f0fdf4;
  --r:18px;--rs:12px;--sh:0 1px 2px rgba(11,31,42,.05),0 8px 24px rgba(11,31,42,.06);
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
h1{font-size:clamp(22px,2.4vw,28px);letter-spacing:-.03em;margin:0;line-height:1.2;overflow-wrap:anywhere}
h2{font-size:17px;letter-spacing:-.02em;margin:26px 0 10px;font-weight:700}
p{margin:0}
.muted{color:var(--mute)}
.small{font-size:13px}
.err{color:var(--red)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.form-grid{display:grid;grid-template-columns:1fr;gap:0 16px}
.span2{grid-column:1/-1}
.two-col{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
.grid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:6px}
.grid-cards{display:grid;grid-template-columns:1fr;gap:12px}
.mobile-only{display:inline-flex}
.desk-only{display:none}
.crumb{font-size:13px;color:var(--mute);margin-bottom:10px}
.crumb a{color:var(--mute);text-decoration:none}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:4px 0 18px}
.page-sub{color:var(--mute);font-size:14px;margin-top:4px}
.page-actions{display:flex;gap:10px;flex-wrap:wrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border:0;border-radius:var(--rs);background:var(--brand);color:#fff;font-weight:650;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,transform .1s,box-shadow .15s}
.btn svg{width:18px;height:18px;flex:0 0 18px}
.btn:hover{background:var(--brand-d);box-shadow:0 6px 16px rgba(14,116,144,.25)}
.btn:active{transform:scale(.98)}
.btn-lg{min-height:52px;padding:0 24px;font-size:15px}
.btn-block{width:100%}
.btn.sec{background:var(--brand-s);color:var(--brand-d)}
.btn.sec:hover{background:#d3eef6;box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line2)}
.btn.ghost:hover{background:#f7fafb;box-shadow:none}
.btn.danger{background:var(--red-s);color:var(--red)}
.btn.danger:hover{background:#fee2e2;box-shadow:none}
.btn.danger-solid{background:var(--red);color:#fff}
.btn.danger-solid:hover{background:#b91c1c}
.btn-light{background:#fff;color:var(--brand-d)}
.btn-light:hover{background:#f0fbfd;box-shadow:0 8px 20px rgba(0,0,0,.15)}
.link-danger{background:none;border:0;color:var(--red);font-weight:650;cursor:pointer;padding:4px 0;font-size:13px}
.icon-btn{width:42px;height:42px;min-width:42px;border-radius:13px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.icon-btn svg{width:19px;height:19px}
.btn:focus-visible,.icon-btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.side a:focus-visible,.drawer a:focus-visible,.fab:focus-visible,.pick:focus-visible,.role-card:focus-visible{outline:none;box-shadow:0 0 0 4px rgba(14,116,144,.25)}

/* forms */
input,select,textarea{width:100%;min-height:46px;padding:10px 14px;border:1px solid var(--line2);border-radius:var(--rs);background:#fff;outline:none;min-width:0;transition:border-color .15s,box-shadow .15s}
textarea{min-height:88px}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(14,116,144,.14)}
input[type=radio],input[type=checkbox]{width:auto;min-height:0}
label{display:block;font-size:13px;font-weight:650;color:var(--ink2);margin:14px 0 6px}
.search{position:relative;margin:14px 0 2px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mute);pointer-events:none}
.search input{padding-left:44px;min-height:50px;border-radius:14px}
.qty-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qty-row input{flex:1 1 140px;width:auto}
.chips-inline{display:flex;gap:6px;flex-wrap:wrap}
.chips-inline .chip{min-height:36px}
.rate-form{margin-top:12px}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;margin:4px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:#fff;color:var(--ink2);font-size:13px;font-weight:650;text-decoration:none;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.chip:hover:not(.on){border-color:#94a3b8}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* cards & lists */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--sh);min-width:0}
.card h3{margin-top:0}
.flush{padding:4px 18px}
.cardlink{display:block;color:inherit;text-decoration:none;transition:transform .15s,box-shadow .15s}
.cardlink:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(11,31,42,.1)}
.line{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line>*{min-width:0;overflow-wrap:anywhere}
.line.grand{font-size:16px;font-weight:750}
.line-r{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:0 0 auto}
.total-line{border-top:1px solid var(--line);border-bottom:0;margin-top:4px}
a.line{color:inherit;text-decoration:none}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 16px;color:var(--mute);text-align:center}
.empty svg{width:28px;height:28px}
.empty p{font-size:14px}
.badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:650;background:#e2e8f0;color:var(--ink2);white-space:nowrap}
.b-RECEIVED{background:#e0e7ff;color:#3730a3}.b-WASHING{background:#cffafe;color:#155e75}.b-PROCESSING{background:#fef3c7;color:#92400e}.b-IRONING{background:#fde68a;color:#78350f}.b-READY{background:#dcfce7;color:#166534}.b-DELIVERED{background:#d1fae5;color:#065f46}.b-CANCELLED{background:#fee2e2;color:#991b1b}
.b-UNPAID{background:#fee2e2;color:#991b1b}.b-PARTIAL{background:#fef3c7;color:#92400e}.b-PAID{background:#dcfce7;color:#166534}
.avatar{width:42px;height:42px;min-width:42px;border-radius:14px;background:linear-gradient(135deg,#cdeff7,#b5e6dc);color:var(--brand-d);display:inline-flex;align-items:center;justify-content:center;font-weight:750;font-size:14px}
.avatar.sm{width:34px;height:34px;min-width:34px;font-size:12px;border-radius:11px}

/* picker tiles (wizard) */
.pick-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:4px}
.pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;background:#fff;border:1.5px solid var(--line);border-radius:16px;cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s}
.pick:hover{border-color:#9fd3e0}
.pick.on{border-color:var(--brand);background:var(--brand-s);box-shadow:0 0 0 3px rgba(14,116,144,.12)}
.pick b{display:block}
.pick small{display:block;color:var(--mute);font-size:13px}
.pick>span:last-child{min-width:0;flex:1}
.newbox{margin-top:16px;border:1px dashed var(--line2);border-radius:16px;padding:12px 16px;background:#fbfdfe}
.newbox summary{cursor:pointer;font-weight:650;color:var(--brand-d);display:flex;align-items:center;gap:8px;list-style:none}
.newbox summary svg{width:18px;height:18px}
.newbox form{margin-top:8px}

/* customer & order cards */
.cust-card{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;text-decoration:none;color:inherit;box-shadow:var(--sh);transition:transform .15s,box-shadow .15s}
.cust-card:hover{transform:translateY(-2px);box-shadow:0 14px 28px rgba(11,31,42,.1)}
.cc-body{flex:1;min-width:0}
.cc-body b{display:block}
.cc-body small{color:var(--mute);font-size:13px}
.due-tag,.ok-tag{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap}
.due-tag{background:var(--red-s);color:var(--red)}
.ok-tag{background:var(--green-s);color:var(--green)}
.order-card{display:block;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;text-decoration:none;color:inherit;box-shadow:var(--sh);transition:transform .15s,box-shadow .15s}
.order-card:hover{transform:translateY(-2px);box-shadow:0 14px 28px rgba(11,31,42,.1)}
.order-card.is-late{box-shadow:inset 4px 0 0 var(--red),var(--sh)}
.oc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.oc-no{font-size:12px;color:var(--mute);font-weight:650;letter-spacing:.02em}
.oc-name{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.oc-bar{height:6px;background:#e8eef2;border-radius:4px;margin:12px 0 10px;overflow:hidden}
.oc-bar i{display:block;height:100%;background:linear-gradient(90deg,#0e7490,#14b8a6);border-radius:4px}
.oc-bot{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mute);flex-wrap:wrap}
.oc-due svg{width:13px;height:13px;vertical-align:-2px}
.oc-total{color:var(--ink);font-weight:700}
.oc-total em{font-style:normal;color:var(--red);font-weight:650;font-size:12px;margin-left:4px}
.is-late .oc-due{color:var(--red);font-weight:650}

/* stats */
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--sh);min-width:0}
.stat-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stat-label{font-size:12px;color:var(--mute);font-weight:650;text-transform:uppercase;letter-spacing:.05em}
.stat-ico svg{width:16px;height:16px;color:var(--brand)}
.stat-value{font-size:clamp(18px,2vw,22px);font-weight:750;letter-spacing:-.02em;margin-top:8px;overflow-wrap:anywhere}
.stat.red .stat-value{color:var(--red)}
.bar-row{display:grid;grid-template-columns:64px minmax(0,1fr) 96px;gap:10px;align-items:center;font-size:13px;margin:12px 0}
.bar{height:10px;background:#e8eef2;border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#0e7490,#14b8a6);border-radius:6px}
.bar-row b{text-align:right}

/* wizard */
.wsteps{list-style:none;display:flex;gap:4px;padding:0;margin:0 0 16px}
.wsteps li{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mute);position:relative;min-width:0}
.wsteps li:before{content:"";position:absolute;top:14px;left:-50%;width:100%;height:2px;background:var(--line)}
.wsteps li:first-child:before{display:none}
.wsteps li.done:before{background:var(--teal)}
.wsteps li span{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#e2e8f0;color:var(--ink2);font-weight:750;font-size:12px}
.wsteps li span svg{width:14px;height:14px}
.wsteps li.done span{background:var(--teal);color:#fff}
.wsteps li.cur span{background:var(--brand);color:#fff;box-shadow:0 0 0 4px rgba(14,116,144,.18)}
.wsteps li.cur{color:var(--ink);font-weight:650}
.wsteps em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.wcard{padding:20px}
.wcard h2:first-child{margin-top:0}
.sum{background:#f7fafb;border-radius:14px;padding:4px 14px;margin:6px 0 12px}
.wfoot{display:flex;justify-content:space-between;gap:12px;margin-top:4px}
.wfoot>span{flex:1}
.wfoot .btn{min-width:140px}

/* dashboard */
.hero{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:18px;padding:26px;border-radius:24px;background:linear-gradient(120deg,#0b1f2a 0%,#0e5e73 55%,#0f9b9a 100%);color:#fff;box-shadow:0 18px 40px rgba(14,116,144,.22)}
.hero:after{content:"";position:absolute;right:-70px;top:-70px;width:230px;height:230px;border-radius:50%;border:1px solid rgba(255,255,255,.14);box-shadow:0 0 0 40px rgba(255,255,255,.04)}
.hero>*{position:relative;z-index:1}
.hero h1{color:#fff;margin:6px 0 6px}
.hero p{color:#cfeef4;font-size:14px}
.hero-date{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#a7dfe9;font-weight:650}
.hero-date svg{width:14px;height:14px}
.sec-title{margin:24px 0 10px;font-size:15px;color:var(--ink2)}
.attn-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.attn{display:flex;gap:12px;align-items:center;padding:16px;background:#fff;border:1px solid var(--line);border-radius:16px;text-decoration:none;color:inherit;box-shadow:var(--sh);transition:transform .15s,box-shadow .15s}
.attn:hover{transform:translateY(-2px);box-shadow:0 14px 28px rgba(11,31,42,.1)}
.attn-ico{width:42px;height:42px;min-width:42px;border-radius:13px;display:grid;place-items:center}
.attn-ico svg{width:20px;height:20px}
.attn-n{font-size:22px;font-weight:750;letter-spacing:-.02em;line-height:1.1}
.attn-l{font-size:12px;color:var(--mute);font-weight:650}
.tone-red .attn-ico{background:var(--red-s);color:var(--red)}
.tone-green .attn-ico{background:var(--green-s);color:var(--green)}
.tone-amber .attn-ico{background:var(--amber-s);color:var(--amber)}
.tone-brand .attn-ico{background:var(--brand-s);color:var(--brand)}
.pipeline{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stage{display:flex;flex-direction:column;gap:2px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:16px;text-decoration:none;color:inherit;box-shadow:var(--sh);transition:transform .15s}
.stage:hover{transform:translateY(-2px)}
.stage-n{font-size:22px;font-weight:750}
.stage-l{font-size:12px;color:var(--mute);font-weight:650}

/* order detail */
.detail-hero{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--sh);margin-bottom:14px}
.dh-no{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--mute);font-weight:650;flex-wrap:wrap}
.dh-name{font-size:20px;font-weight:750;letter-spacing:-.02em;margin:6px 0 2px}
.dh-money{display:flex;gap:20px;flex-wrap:wrap}
.dh-money div{display:flex;flex-direction:column;min-width:80px}
.dh-money span{font-size:12px;color:var(--mute);font-weight:650;text-transform:uppercase;letter-spacing:.05em}
.dh-money b{font-size:19px;letter-spacing:-.02em}
.dh-money .due b{color:var(--red)}
.stepper{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin:4px 0 18px}
.st{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.st:before{content:"";height:5px;width:100%;border-radius:3px;background:var(--line)}
.st.done:before{background:var(--teal)}
.st.cur:before{background:linear-gradient(90deg,var(--teal),var(--brand))}
.st-label{font-size:11px;color:var(--mute);font-weight:650;line-height:1.2;overflow-wrap:anywhere}
.st.done .st-label{color:var(--ink)}
.st.cur .st-label{color:var(--brand);font-weight:750}
.stepper-cancel{padding:10px 14px;border-radius:12px;background:var(--red-s);color:var(--red);font-weight:650;margin-bottom:14px}
.pay-row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.pay-row:last-child{border-bottom:0}
.pay-ico{width:36px;height:36px;min-width:36px;border-radius:12px;display:grid;place-items:center}
.pay-ico svg{width:17px;height:17px}
.pay-ico.in{background:var(--green-s);color:var(--green)}
.pay-ico.out{background:var(--red-s);color:var(--red)}
.pay-body{flex:1;min-width:0}
.pay-body b{display:block;font-size:14px}
.pay-body small{display:block;color:var(--mute);font-size:12px;overflow-wrap:anywhere}
.pay-amt{font-weight:750;text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.pay-amt.neg{color:var(--red)}
.pay-amt.pos{color:var(--green)}
.prod-rate{font-size:22px;font-weight:750;letter-spacing:-.02em;margin-top:10px}
.prod-rate span{font-size:13px;color:var(--mute);font-weight:600}
.unit{font-size:12px;font-weight:700;background:#e2e8f0;padding:4px 9px;border-radius:8px;height:fit-content}
.prod.inactive{opacity:.6}
.prod form+button,.prod>button{margin-top:10px}

/* role & login */
.login-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px 18px;background:radial-gradient(900px 480px at 85% -10%,#cdeff7,transparent),radial-gradient(800px 400px at -10% 110%,#c8f1e8,transparent),var(--bg)}
.login-brand{text-align:center;max-width:420px}
.login-brand>svg{width:44px;height:44px;color:var(--brand)}
.login-brand h1{margin:10px 0 6px}
.login-brand p{color:var(--mute)}
.login-card{width:100%;max-width:420px;background:#fff;border-radius:24px;padding:22px;box-shadow:0 20px 50px rgba(11,31,42,.1);border:1px solid var(--line)}
.login-card h2{margin:0 0 4px}
.role-list{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.role-card{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border:1.5px solid var(--line);border-radius:16px;background:#fff;cursor:pointer;text-align:left;transition:border-color .15s,background .15s}
.role-card:hover{border-color:var(--brand);background:#f7fdff}
.role-card b{display:block}
.role-card small{color:var(--mute);font-size:13px}
.role-card .rc-text{flex:1;min-width:0}
.role-ico{width:40px;height:40px;min-width:40px;border-radius:13px;background:var(--brand-s);color:var(--brand-d);display:grid;place-items:center}
.role-ico svg{width:20px;height:20px}
.chev{width:18px;height:18px;color:var(--mute)}
.track-link{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:12px;text-decoration:none;font-weight:650;color:var(--brand-d);background:var(--brand-s)}
.track-link svg{width:18px;height:18px}
.public{max-width:560px;margin:0 auto;padding:24px 16px 60px}

/* app shell */
.shell{min-height:100vh}
.main{padding:14px 14px 140px;min-width:0;max-width:100%}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px}
.tb-left,.tb-right{display:flex;align-items:center;gap:10px;min-width:0}
.tb-brand{align-items:center;gap:8px;font-weight:750;font-size:15px;min-width:0}
.tb-brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-brand svg{width:20px;height:20px;color:var(--brand)}
.role-pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--brand-s);color:var(--brand-d);font-size:12px;font-weight:700;white-space:nowrap}
.role-pill svg{width:14px;height:14px}
.side{display:none}
.side .brand{display:flex;align-items:center;gap:10px;color:#fff;padding:6px 10px 18px}
.side .brand svg{width:26px;height:26px;color:#5eead4;flex:0 0 26px}
.side .brand b{display:block;font-size:15px;line-height:1.2}
.side .brand small{color:#8fb9c2;font-size:12px}
.side h4,.drawer h4{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#6fa3ad;margin:18px 12px 6px;font-weight:700}

<script>
/* Keep Netlify badge hidden even if a script injects it after page load. */
(function () {
  const selectors = '#netlify-badge, .nl-wrap, .netlify-badge, [data-netlify-badge], netlify-badge, iframe[src*="netlify" i], iframe[title*="netlify" i], a[href*="app.netlify.com" i]';
  function hideNetlifyBadge(root) {
    if (root.nodeType !== 1) return;
    if (root.matches && root.matches(selectors)) root.style.setProperty('display', 'none', 'important');
    if (root.querySelectorAll) root.querySelectorAll(selectors).forEach(el => el.style.setProperty('display', 'none', 'important'));
  }
  hideNetlifyBadge(document.documentElement);
  new MutationObserver(records => records.forEach(record => record.addedNodes.forEach(hideNetlifyBadge)))
    .observe(document.documentElement, { childList: true, subtree: true });
})();

function parseRupees(s){const t=String(s??'').trim();if(t==='')return 0;if(!/^\d+(\.\d{1,2})?$/.test(t))throw new Error('Enter a valid amount in rupees, e.g. 80 or 12.50');const [w,f='']=t.split('.');return Number(w)*100+Number(f.padEnd(2,'0'));}

  const results=await Promise.allSettled(pending.map(x=>x.p));
  results.forEach((r,i)=>{
    if(r.status==='fulfilled')db.trackSig[pending[i].no]=pending[i].sig;
    else{console.error('Tracking publish failed for '+pending[i].no,r.reason);toast('Tracking not published for '+pending[i].no+': '+(r.reason&&r.reason.message?r.reason.message:r.reason));}
  });
}
async function commit(){
  await publishTracking();
  await setDoc(DOC_REF,cleanData());
}
// Non-financial changes: saved in the background, with an error message if it fails.
function save(){commit().catch(err=>{console.error(err);toast('Could not save to the server. Check your connection.');});}
// Financial changes: only confirmed as successful after the server accepts them.
async function persist(msg){
  try{await commit();if(msg)toast(msg);return true;}
  catch(err){console.error(err);toast('Not saved: no connection to the server. Nothing was recorded.');await reloadFromServer();return false;}
}
async function reloadFromServer(){
  try{const s=await getDoc(DOC_REF);if(s.exists())db=s.data();}catch(e){}
  render();
}

/* ---------- core domain logic ---------- */
function addProduct(o){
  const name=(o.name||'').trim();if(!name)throw new Error('Product name is required');
  if(!['KG','PCS'].includes(o.unit))throw new Error('Choose a unit (KG or PCS)');
  const rate=parseRupees(o.rate);if(rate<=0)throw new Error('Rate must be greater than zero');
  const p={id:uid('p'),name,category:(o.category||'General').trim(),unit:o.unit,ratePaise:rate,description:(o.description||'').trim(),active:true,history:[]};
  db.products.push(p);audit('Product added',name+' '+inr(rate)+'/'+o.unit);return p;
}
function addCustomer(o){
  const name=(o.name||'').trim();if(!name)throw new Error('Customer name is required');
  const mobile=String(o.mobile||'').replace(/[\s-]/g,'');
  if(!/^\d{10}$/.test(mobile))throw new Error('Enter a 10-digit mobile number');
  if(db.customers.some(c=>c.mobile===mobile))throw new Error('A customer with this mobile already exists');
  const c={id:uid('c'),code:nextNo('customer','CUST'),name,mobile,
    whatsapp:String(o.whatsapp||mobile).replace(/[\s-]/g,''),email:(o.email||'').trim(),
    address:(o.address||'').trim(),opening:parseRupees(o.opening||'')};
  db.customers.push(c);audit('Customer created',c.code+' '+name);return c;
}
function priceItems(raw){
  if(!raw.length)throw new Error('Add at least one item');
  return raw.map(i=>{
    const p=db.products.find(x=>x.id===i.productId);
    if(!p)throw new Error('Product not found');
    if(!p.active)throw new Error(p.name+' is inactive');
    if(i.qtyMilli<=0)throw new Error('Quantity must be greater than zero');
    if(p.unit==='PCS'&&i.qtyMilli%1000)throw new Error(p.name+': pieces must be whole numbers');
    return {productId:p.id,name:p.name,unit:p.unit,qtyMilli:i.qtyMilli,rate:p.ratePaise,amount:lineAmount(i.qtyMilli,p.ratePaise)};
  });
}
function totalsOf(items,discount,extra){
  const subtotal=items.reduce((s,i)=>s+i.amount,0);
  if(discount<0||extra<0)throw new Error('Discount and charges cannot be negative');
  if(discount>subtotal+extra)throw new Error('Discount cannot exceed the order value');
  return {items,subtotal,discount,extra,total:subtotal-discount+extra};
}
function netPaid(invId){return db.payments.filter(p=>p.invoiceId===invId).reduce((s,p)=>s+(p.isReversal?-p.amount:p.amount),0);}
function invOf(orderId){return db.invoices.find(i=>i.orderId===orderId);}
function fin(o){
  const inv=invOf(o.id);const paid=netPaid(inv.id);const bal=inv.total-paid;
  const ps=paid===0?'UNPAID':(bal===0?'PAID':'PARTIAL');
  return {inv,paid,bal,ps};
}
function custStats(cid){
  const c=db.customers.find(x=>x.id===cid);
  const ords=db.orders.filter(o=>o.customerId===cid&&o.status!=='CANCELLED');
  const billed=ords.reduce((s,o)=>s+o.total,0);
  const paid=db.payments.filter(p=>p.customerId===cid).reduce((s,p)=>s+(p.isReversal?-p.amount:p.amount),0);
  return {orders:ords.length,billed,paid,bal:(c?c.opening:0)+billed-paid};
}
function defaultAccounts(){const now=new Date().toISOString();return [
  {id:uid('a'),name:'Cash in hand',type:'CASH',bank:'',last4:'',openingPaise:0,active:true,createdAt:now},
  {id:uid('a'),name:'Main bank account',type:'BANK',bank:'',last4:'',openingPaise:0,active:true,createdAt:now}];}
function accName(id){const a=db.accounts.find(x=>x.id===id);return a?a.name:'Unassigned';}
function accBalance(id){const a=db.accounts.find(x=>x.id===id);const net=db.payments.filter(p=>p.accountId===id).reduce((s,p)=>s+(p.isReversal?-p.amount:p.amount),0);return (a?a.openingPaise:0)+net;}
function accFor(method){const want=method==='CASH'?'CASH':'BANK';const a=db.accounts.find(x=>x.active&&x.type===want);return a?a.id:null;}
function checkAccount(accountId,method){
  const want=method==='CASH'?'CASH':'BANK';
  const a=db.accounts.find(x=>x.id===accountId);
  if(!a||!a.active)throw new Error('Choose the cash or bank account that received this money');
  if(a.type!==want)throw new Error(method==='CASH'?'Cash payments must go to a cash drawer account':'Non-cash payments must go to a bank account');
}
function recordPayment(p){
  const dup=db.payments.find(x=>x.idem===p.idem);if(dup)return {dup:true,payment:dup};
  const inv=db.invoices.find(i=>i.id===p.invoiceId);if(!inv)throw new Error('Invoice not found');
  const o=db.orders.find(x=>x.id===inv.orderId);
  if(o.status==='CANCELLED')throw new Error('Cannot take payment on a cancelled order');
  if(!Number.isSafeInteger(p.amount)||p.amount<=0)throw new Error('Enter an amount greater than zero');
  if(!METHODS.includes(p.method))throw new Error('Choose a payment method');
  checkAccount(p.accountId,p.method);
  if(p.method!=='CASH'&&!p.ref)throw new Error('Enter the reference number for '+METHOD_LABEL[p.method]+' payments');
  const bal=fin(o).bal;
  if(p.amount>bal)throw new Error('Amount is more than the outstanding balance of '+inr(bal));
  const pay={id:uid('p'),paymentNo:nextNo('payment','PAY'),invoiceId:inv.id,accountId:p.accountId,customerId:o.customerId,
    amount:p.amount,method:p.method,ref:p.ref||'',date:p.date||today(),at:new Date().toISOString(),
    by:p.by||'Staff',idem:p.idem,isReversal:false,reversesId:null};
  db.payments.push(pay);audit('Payment recorded',pay.paymentNo+' '+inr(pay.amount)+' on '+o.orderNo);
  return {payment:pay};
}
function placeOrder(d){
  const dup=db.orders.find(o=>o.idem===d.idem);if(dup)return {order:dup,dup:true};
  if(!db.customers.some(c=>c.id===d.customerId))throw new Error('Select a customer');
  if(!d.orderDate||!d.expectedDate)throw new Error('Enter both dates');
  if(d.expectedDate<d.orderDate)throw new Error('Delivery date cannot be before the order date');
  const t=totalsOf(priceItems(d.items),d.discountPaise,d.extraPaise);
  if(d.advancePaise<0||d.advancePaise>t.total)throw new Error('Advance cannot be more than the grand total');
  if(d.advancePaise>0&&d.method!=='CASH'&&!d.ref)throw new Error('Enter the reference number for '+METHOD_LABEL[d.method]+' payments');
  if(d.advancePaise>0)checkAccount(d.accountId,d.method);
  const now=new Date().toISOString();
  const oid=uid('o');
  const order={id:oid,orderNo:nextNo('order',db.settings.orderPrefix),trackId:trackIdFor(oid),customerId:d.customerId,
    status:d.status||'RECEIVED',orderDate:d.orderDate,expectedDate:d.expectedDate,
    instructions:d.instructions||'',notes:d.notes||'',items:t.items,subtotal:t.subtotal,
    discount:t.discount,extra:t.extra,total:t.total,by:d.by,createdAt:now,idem:d.idem||uid('k'),
    history:[{from:null,to:'RECEIVED',by:d.by,at:now,note:'Order created'}]};
  if(order.status!=='RECEIVED')order.history.push({from:'RECEIVED',to:order.status,by:d.by,at:now,note:''});
  db.orders.push(order);
  const inv={id:uid('i'),invoiceNo:nextNo('invoice',db.settings.invoicePrefix),orderId:order.id,total:t.total,issuedAt:now,issuedBy:d.by};
  db.invoices.push(inv);
  if(d.advancePaise>0)recordPayment({invoiceId:inv.id,amount:d.advancePaise,method:d.method,ref:d.ref,by:d.by,idem:order.idem+'-adv',date:d.orderDate,accountId:d.accountId});
  audit('Order created',order.orderNo+' for '+custName(d.customerId)+' '+inr(t.total),d.by);
  return {order};
}
function setStatus(id,to,note){
  if(!can('status'))return deny();
  const o=db.orders.find(x=>x.id===id);if(!o)throw new Error('Order not found');
  if(o.status==='CANCELLED')throw new Error('Cancelled orders cannot be changed');
  if(to===o.status)throw new Error('Order is already in that status');
  if(to==='CANCELLED')return cancelOrder(o);
  const from=o.status;o.status=to;
  o.history.push({from,to,by:ROLE_NAME[user.role],at:new Date().toISOString(),note:(note||'').trim()});
  audit('Status changed',o.orderNo+': '+SL[from]+' to '+SL[to]);
  save();toast('Status updated to '+SL[to]);render();
}
async function cancelOrder(o){
  if(!can('cancel'))throw new Error('Only managers can cancel orders');
  if(o.status==='DELIVERED')throw new Error('Delivered orders cannot be cancelled');
  const paid=fin(o).paid;
  if(paid>0)throw new Error('Reverse the '+inr(paid)+' already received before cancelling');
  const from=o.status;o.status='CANCELLED';
  o.history.push({from,to:'CANCELLED',by:ROLE_NAME[user.role],at:new Date().toISOString(),note:'Cancelled'});
  audit('Order cancelled',o.orderNo);
  await persist('Order cancelled');render();
}
async function reversePayment(id){
  if(!can('payments'))return deny();
  const p=db.payments.find(x=>x.id===id);if(!p||p.isReversal)return;
  if(db.payments.some(x=>x.reversesId===id))return toast('This payment is already reversed');
  const reason=await showDialog({title:'Reverse payment '+p.paymentNo,message:'This will create a reversal entry. Enter a reason to continue.',confirmText:'Reverse payment',danger:true,input:true,placeholder:'Reason for reversal'});
  if(!reason)return;
  db.payments.push({...p,id:uid('p'),paymentNo:nextNo('payment','PAY'),isReversal:true,reversesId:p.id,
    idem:uid('k'),date:today(),at:new Date().toISOString(),by:ROLE_NAME[user.role],ref:'Reversal: '+reason.trim()});
  audit('Payment reversed',p.paymentNo+' - '+reason.trim());
  await persist('Payment reversed');render();
}

function render(){

  const app=document.getElementById('app');
  if(!user){app.innerHTML=loginView();if(window.lucide)window.lucide.createIcons();return;}
  const parts=(location.hash||'#/').slice(2).split('?')[0].split('/');
  const page=parts[0]||'dashboard', id=parts[1]||'', sub=parts[2]||'';
  let body;
  try{
    if(REQ[page]&&!can(REQ[page]))body=denied();
    else if(page==='customers')body=id==='new'?customerForm():(id&&sub==='edit'?customerForm(id):(id?customerProfile(id):customersList()));
    else if(page==='orders')body=id==='new'?wizard(sub||''):(id?orderDetail(id):ordersList());
    else if(page==='tracking')body=ctPage();
    else if(page==='pending')body=pending();
    else if(page==='invoices')body=id?invoiceDetail(id):invoicesList();
    else if(page==='products')body=products();
    else if(page==='payments')body=payments();
    else if(page==='outstanding')body=outstanding();
    else if(page==='reports')body=reports();
    else if(page==='settings')body=settings();
    else if(page==='accounts')body=id?accountLedger(id):accountsPage();
    else if(page==='more')body=more();
    else body=dashboard();
  }catch(e){body=`<div class="card err">Something went wrong: ${esc(e.message)}</div>`;}
  app.innerHTML=shell(body);
  if(window.lucide)window.lucide.createIcons();
}

/* ---------- customer tracking ---------- */
const CT_ACTIVE_DAYS=30;
const CT_FILTERS=[['all','All'],['active','Active'],['dormant','Inactive'],['never','Never ordered'],['dues','With dues']];
function daysBetween(iso){if(!iso)return null;const a=new Date(iso+'T00:00:00'),b=new Date(today()+'T00:00:00');return Math.round((b-a)/86400000);}
function custActivity(cid){
  const ords=db.orders.filter(o=>o.customerId===cid&&o.status!=='CANCELLED');
  const dates=ords.map(o=>o.orderDate).filter(Boolean).sort();
  const firstDate=dates[0]||null,lastDate=dates[dates.length-1]||null;
  const days=lastDate?daysBetween(lastDate):null;
  const billed=ords.reduce((s,o)=>s+o.total,0);
  const spanMonths=firstDate?Math.max(1,daysBetween(firstDate)/30):1;
  const state=!lastDate?'NEVER':(days<=CT_ACTIVE_DAYS?'ACTIVE':'DORMANT');
  return {state,firstDate,lastDate,days,
    avg:ords.length?Math.round(billed/ords.length):0,
    perMonth:ords.length?ords.length/spanMonths:0,
    repeat:ords.length>=2,count:ords.length};
}
function ctStateTag(s){
  return s==='ACTIVE'?'<span class="ok-tag">Active</span>'
       :s==='DORMANT'?'<span class="due-tag">Inactive</span>'
       :'<span class="badge">Never ordered</span>';
}
function ctRow(r){
  const a=r.a;
  const meta=a.lastDate
    ?'Last order '+fdate(a.lastDate)+' · '+(a.days===0?'today':a.days+' day'+(a.days===1?'':'s')+' ago')+' · '+a.count+' order'+(a.count===1?'':'s')
    :'No orders yet';
  return `<a class="cust-card" href="#/customers/${r.c.id}"><span class="avatar sm">${esc(initials(r.c.name))}</span><div class="cc-body"><b>${esc(r.c.name)}</b><small>${esc(meta)}</small></div>${ctStateTag(a.state)}</a>`;
}
function ctListHTML(q,f){
  q=String(q||'').trim().toLowerCase();
  const rows=db.customers.map(c=>({c,a:custActivity(c.id),st:custStats(c.id)}))
    .filter(r=>!q||[r.c.name,r.c.mobile,r.c.code].some(v=>String(v).toLowerCase().includes(q)))
    .filter(r=>{switch(f){
      case 'active':return r.a.state==='ACTIVE';
      case 'dormant':return r.a.state==='DORMANT';
      case 'never':return r.a.state==='NEVER';
      case 'dues':return r.st.bal>0;
      default:return true;}})
    .sort((x,y)=>(y.a.lastDate||'').localeCompare(x.a.lastDate||'')||x.c.name.localeCompare(y.c.name));
  return rows.map(ctRow).join('')||empty('user-search','No customers in this group.');
}
function ctPage(){
  if(!can('customers'))return denied();
  const q=new URLSearchParams((location.hash.split('?')[1])||'');
  const f=CT_FILTERS.some(x=>x[0]===q.get('f'))?q.get('f'):'all';
  const rows=db.customers.map(c=>({c,a:custActivity(c.id)}));
  const ordering=rows.filter(r=>r.a.state!=='NEVER');
  const active=rows.filter(r=>r.a.state==='ACTIVE').length;
  const inactive=rows.filter(r=>r.a.state==='DORMANT').length;
  const never=rows.length-ordering.length;
  const repeatPct=ordering.length?Math.round(100*ordering.filter(r=>r.a.repeat).length/ordering.length):0;
  return pageHead('Customer tracking',db.customers.length+' customers · inactive after '+CT_ACTIVE_DAYS+' days without an order')+
    `<div class="grid4">${kpi('Active',active,'','activity')}${kpi('Inactive',inactive,inactive?'red':'','user-x')}${kpi('Never ordered',never,'','user-plus')}${kpi('Repeat customers',repeatPct+'%','','repeat')}</div>`+
    `<div class="chips" style="margin-top:12px">${CT_FILTERS.map(([k,l])=>`<a href="#/tracking${k==='all'?'':'?f='+k}" class="chip ${f===k?'on':''}">${l}</a>`).join('')}</div>`+
    `<div class="search">${ICON('search')}<input placeholder="Search by name, mobile or code" data-live="ct" data-f="${f}" data-target="ctList" autocomplete="off"></div>`+
    `<div id="ctList" style="margin-top:12px">${ctListHTML('',f)}</div>`;

/* ---------- date filters ---------- */
const DR={};
function drState(k){return DR[k]||(DR[k]={p:'all',from:'',to:''});}
function drBounds(k){
  const st=drState(k),t=today(),first=t.slice(0,8)+'01';
  switch(st.p){
    case 'today':return [t,t];
    case '7':return [addDays(t,-6),t];
    case 'month':return [first,t];
    case 'last':{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);return [fmtISO(d),addDays(first,-1)];}
    case 'custom':return [st.from||'',st.to||''];
    default:return ['',''];
  }
}
function inDR(k,d){const [f,t]=drBounds(k);if(!d)return true;return (!f||d>=f)&&(!t||d<=t);}
function drBar(k,label){
  const st=drState(k);const [f,t]=drBounds(k);
  const presets=[['all','All'],['today','Today'],['7','Last 7 days'],['month','This month'],['last','Last month'],['custom','Custom']];
  const shown=(f||t)?`${label}: ${f?fdate(f):'from start'} to ${t?fdate(t):'today'}`:`Showing all ${label.toLowerCase()}s`;
  return `<div class="dr-bar"><div class="chips">${presets.map(([v,l])=>`<button type="button" class="chip ${st.p===v?'on':''}" data-dr="${k}" data-dp="${v}">${l}</button>`).join('')}</div>
    ${st.p==='custom'?`<div class="dr-custom"><div><label>From</label><input type="date" value="${st.from}" data-dr-from="${k}"></div><div><label>To</label><input type="date" value="${st.to}" data-dr-to="${k}"></div></div>`:''}
    <div class="muted small dr-note">${shown}</div></div>`;
}

function orderMatches(o,q){
  if(!q)return true;const c=db.customers.find(x=>x.id===o.customerId);
  return [o.orderNo,c?c.name:'',c?c.mobile:''].some(v=>v.toLowerCase().includes(q));
}
function ordListHTML(q){

/* ---------- wizard: new order ---------- */
function startDraft(preset){
  draft={step:1,preset:preset||'',customerId:preset||'',items:[],addProd:'',addQty:'',
    orderDate:today(),expected:addDays(today(),2),discount:'',extra:'',advance:'',method:'CASH',accountId:accFor('CASH'),ref:'',instructions:'',idem:uid('k')};
  const first=db.products.find(p=>p.active);if(first)draft.addProd=first.id;
}
function readStep(){document.querySelectorAll('[data-d]').forEach(el=>{draft[el.dataset.d]=el.value;});}
function currentTotals(){
  return totalsOf(priceItems(draft.items),parseRupees(draft.discount),parseRupees(draft.extra));
}
function tryTotals(){try{return {t:currentTotals()};}catch(e){return {err:e.message};}}
function sumCard(t){
  return `<div class="sum"><div class="line"><span>Subtotal</span><b>${inr(t.subtotal)}</b></div><div class="line"><span>Discount</span><b>− ${inr(t.discount)}</b></div><div class="line"><span>Extra charges</span><b>${inr(t.extra)}</b></div><div class="line grand"><span>Total</span><b>${inr(t.total)}</b></div></div>`;
}
function custPickHTML(q){
  q=String(q||'').trim().toLowerCase();
  const list=db.customers.filter(c=>!q||[c.name,c.mobile].some(v=>v.toLowerCase().includes(q)));
  if(!list.length)return empty('user-search','No customer found. Add a new one below.');
  return list.map(c=>`<button type="button" class="pick ${draft.customerId===c.id?'on':''}" data-pick-cust="${c.id}"><span class="avatar sm">${esc(initials(c.name))}</span><span><b>${esc(c.name)}</b><small>${esc(c.mobile)}${c.address?' · '+esc(c.address):''}</small></span></button>`).join('');
}
function wizard(preset){
  if(!can('orders'))return denied();
  if(preset&&(!draft||draft.preset!==preset))startDraft(preset);
  if(!draft)startDraft('');
  const steps=['Customer','Items','Details','Payment','Review'];
  const head=`<ol class="wsteps">${steps.map((s,i)=>`<li class="${i+1<draft.step?'done':''} ${i+1===draft.step?'cur':''}"><span>${i+1<draft.step?ICON('check'):(i+1)}</span><em>${s}</em></li>`).join('')}</ol>`;
  let inner='';
  if(draft.step===1){
    inner=`<h2>Who is this order for?</h2>
      <div class="search">${ICON('search')}<input placeholder="Search customer by name or mobile" data-live="wcust" data-target="wcustList" autocomplete="off"></div>
      <div id="wcustList" class="pick-grid" style="margin-top:12px">${custPickHTML('')}</div>
      <details class="newbox"><summary>${ICON('user-plus')} New customer</summary>
        <form data-form="wcust"><div class="form-grid"><div><label>Name *</label><input name="name" required></div>
        <div><label>Mobile * (10 digits)</label><input name="mobile" inputmode="tel" required></div>
        <div class="span2"><label>Address</label><input name="address"></div></div>
        <button class="btn sec btn-block" style="margin-top:12px">Save and continue</button></form></details>`;
  }
  if(draft.step===2){
    const actives=db.products.filter(p=>p.active);
    const selP=db.products.find(p=>p.id===draft.addProd)||actives[0];
    const unit=selP?selP.unit:'KG';
    const pre=unit==='PCS'?[1,2,3,5,10]:[0.5,1,2,5,10];
    const R=draft.items.length?tryTotals():{};
    const items=draft.items.map((it,i)=>{const p=db.products.find(x=>x.id===it.productId);return `<div class="line"><div style="min-width:0"><b>${esc(p.name)}</b><div class="muted small">${qtyText(it.qtyMilli,p.unit)} ${p.unit} × ${inr(p.ratePaise)}</div></div><div class="line-r"><b>${inr(lineAmount(it.qtyMilli,p.ratePaise))}</b><button class="link-danger" data-act="wremove" data-i="${i}">Remove</button></div></div>`;}).join('');
    inner=`<h2>What are we washing?</h2>
      <input type="hidden" data-d="addProd" value="${esc(draft.addProd)}">
      ${(can('products')&&selP)?`<form class="price-edit" data-form="itemprice" data-id="${selP.id}"><div class="qty-row"><span class="small muted">Price per ${selP.unit} for ${esc(selP.name)}</span><input name="rate" inputmode="decimal" value="${(selP.ratePaise/100).toFixed(2)}"><button class="btn ghost">Update price</button></div></form>`:''}
      <div class="pick-grid">${actives.map(p=>`<button type="button" class="pick ${p.id===draft.addProd?'on':''}" data-pick-prod="${p.id}"><span><b>${esc(p.name)}</b><small>${esc(p.category)} · ${inr(p.ratePaise)} / ${p.unit}</small></span></button>`).join('')}</div>
      <label>Quantity (${unit})</label>
      <div class="qty-row"><input data-d="addQty" inputmode="decimal" value="${esc(draft.addQty)}" placeholder="${unit==='PCS'?'e.g. 3':'e.g. 2.5'}">
        <div class="chips-inline">${pre.map(v=>`<button type="button" class="chip" data-qpre="${v}">${v}</button>`).join('')}</div></div>
      <button class="btn sec btn-block" style="margin-top:14px" data-act="wadd">${ICON('plus')} Add to order</button>
      <h2>In this order</h2>
      <div class="card">${items||empty('shirt','No items yet. Pick a service above.')}${draft.items.length?`<div class="line total-line"><span>Subtotal</span><b>${inr(R.t?R.t.subtotal:0)}</b></div>`:''}</div>`;
  }
  if(draft.step===3){
    inner=`<h2>Dates & adjustments</h2>
      <div class="form-grid">
        <div><label>Order date</label><input type="date" data-d="orderDate" value="${esc(draft.orderDate)}"></div>
        <div><label>Delivery date</label><input type="date" data-d="expected" value="${esc(draft.expected)}"></div>
      </div>
      <label>Quick delivery</label>
      <div class="chips-inline">${[1,2,3,5].map(n=>`<button type="button" class="chip" data-dd="${n}">${n===1?'Next day':n+' days'}</button>`).join('')}</div>
      <div class="form-grid" style="margin-top:6px">
        <div><label>Discount (₹)</label><input data-d="discount" inputmode="decimal" value="${esc(draft.discount)}" placeholder="0"></div>
        <div><label>Extra charges (₹)</label><input data-d="extra" inputmode="decimal" value="${esc(draft.extra)}" placeholder="0"></div>
      </div>
      <label>Special instructions</label><textarea data-d="instructions" rows="2">${esc(draft.instructions)}</textarea>`;
  }
  if(draft.step===4){
    const R=tryTotals();
    inner=`<h2>Take an advance now?</h2>${R.t?sumCard(R.t):`<div class="card err">${esc(R.err)}</div>`}
      <label>Advance paid (₹)</label>
      <div class="qty-row"><input data-d="advance" inputmode="decimal" value="${esc(draft.advance)}" placeholder="0"><button type="button" class="chip" data-pfull="1">Pay full amount</button></div>
      <div class="form-grid">
        <div><label>Payment method</label><select data-d="method">${METHODS.map(m=>`<option value="${m}" ${draft.method===m?'selected':''}>${METHOD_LABEL[m]}</option>`).join('')}</select></div>
        <div><label>Received into</label><select data-d="accountId">${accOptionsHTML(draft.method,draft.accountId)}</select></div><div><label>Reference (required for non-cash)</label><input data-d="ref" value="${esc(draft.ref)}" placeholder="UPI / bank / card reference"></div>
      </div>
      ${R.t?`<div class="line" style="margin-top:8px"><span class="muted">Balance after advance</span><b>${inr(R.t.total-(parseFloat(draft.advance||0)>0?parseRupees(draft.advance):0))}</b></div>`:''}`;
  }
  if(draft.step===5){
    const R=tryTotals();
    const c=db.customers.find(x=>x.id===draft.customerId);
    inner=`<h2>Review and save</h2>
      <div class="card" style="margin-bottom:12px"><b>${esc(c?c.name:'No customer selected')}</b><div class="muted small">${esc(c?c.mobile:'')}</div><div class="muted small" style="margin-top:6px">Ordered ${fdate(draft.orderDate)} · Delivery ${fdate(draft.expected)}</div></div>
      ${R.t?`<div class="card">${R.t.items.map(i=>`<div class="line"><span>${esc(i.name)} (${qtyText(i.qtyMilli,i.unit)} ${i.unit})</span><b>${inr(i.amount)}</b></div>`).join('')}${sumCard(R.t)}
        <div class="line"><span>Advance</span><b>${inr(parseRupees(draft.advance))}</b></div><div class="line grand"><span>Balance due</span><b>${inr(R.t.total-parseRupees(draft.advance))}</b></div></div>`:`<div class="card err">${esc(R.err)}</div>`}`;
  }
  const foot=`<div class="wfoot">${draft.step>1?'<button class="btn ghost" data-act="wback">Back</button>':'<span></span>'}${draft.step<5?'<button class="btn" data-act="wnext">Continue</button>':'<button class="btn" data-act="wsave">Save order</button>'}</div>`;
  return pageHead('New order',`Step ${draft.step} of 5`)+head+`<div class="card wcard">${inner}</div>`+foot;
}

/* ---------- outstanding ---------- */
function outstanding(){
  const rows=db.customers.map(c=>({c,st:custStats(c.id)})).filter(r=>!outOnly||r.st.bal>0).sort((a,b)=>b.st.bal-a.st.bal);
  const invs=db.invoices.map(i=>{const o=db.orders.find(x=>x.id===i.orderId);return {i,o,f:fin(o)};}).filter(x=>x.o.status!=='CANCELLED'&&x.f.bal>0);
  const total=rows.reduce((s,r)=>s+(r.st.bal>0?r.st.bal:0),0);
  const invRow=x=>`<a class="order-card" href="#/invoices/${x.i.id}"><div class="oc-top"><div style="min-width:0"><div class="oc-no">${esc(x.i.invoiceNo)}</div><div class="oc-name">${esc(custName(x.o.customerId))}</div></div>${payBadge(x.f.ps)}</div><div class="oc-bot" style="margin-top:12px"><span>Paid ${inr(x.f.paid)} of ${inr(x.i.total)}</span><span class="oc-total">Due ${inr(x.f.bal)}</span></div></a>`;
  return pageHead('Outstanding',`${inr(total)} to collect`)+
    `<div class="grid4">${kpi('Total due',inr(total),total>0?'red':'','wallet')}${kpi('Customers with dues',db.customers.filter(c=>custStats(c.id).bal>0).length,'','users')}${kpi('Unpaid invoices',invs.filter(x=>x.f.ps==='UNPAID').length,'','receipt')}${kpi('Partly paid',invs.filter(x=>x.f.ps==='PARTIAL').length,'','circle-alert')}</div>`+
    `<div class="chips" style="margin-top:12px"><a href="#/outstanding" class="chip ${outOnly?'on':''}" data-act="outonly">${outOnly?'Showing customers with dues':'Show only customers with dues'}</a></div>`+
    '<h2>By customer</h2><div class="stack">'+rows.map(r=>`<a class="cust-card" href="#/customers/${r.c.id}"><span class="avatar sm">${esc(initials(r.c.name))}</span><div class="cc-body"><b>${esc(r.c.name)}</b><small>Billed ${inr(r.st.billed)} · Paid ${inr(r.st.paid)}</small></div>${r.st.bal>0?`<span class="due-tag">${inr(r.st.bal)}</span>`:'<span class="ok-tag">Settled</span>'}</a>`).join('')+'</div>'+
    '<h2>Unpaid invoices</h2><div class="stack">'+(invs.filter(x=>x.f.ps==='UNPAID').map(invRow).join('')||empty('circle-check','None.'))+'</div>'+
    '<h2>Partly paid invoices</h2><div class="stack">'+(invs.filter(x=>x.f.ps==='PARTIAL').map(invRow).join('')||empty('circle-check','None.'))+'</div>';
}

/* ---------- reports ---------- */
function reports(){
  if(!rFrom){rFrom=today().slice(0,8)+'01';rTo=today();}
  const inR=d=>d>=rFrom&&d<=rTo;
  const live=db.orders.filter(o=>o.status!=='CANCELLED'&&inR(o.orderDate));
  const cancelled=db.orders.filter(o=>o.status==='CANCELLED'&&inR(o.orderDate));
  const pays=db.payments.filter(p=>inR(p.date));
  const sales=live.reduce((s,o)=>s+o.total,0);
  const collected=pays.reduce((s,p)=>s+(p.isReversal?-p.amount:p.amount),0);
  const outNow=db.customers.reduce((s,c)=>s+custStats(c.id).bal,0);
  const daily={};live.forEach(o=>{daily[o.orderDate]=(daily[o.orderDate]||0)+o.total;});
  const prod={};live.forEach(o=>o.items.forEach(i=>{prod[i.name]=(prod[i.name]||0)+i.amount;}));
  const byAcc={};pays.forEach(p=>{const n=accName(p.accountId);byAcc[n]=(byAcc[n]||0)+(p.isReversal?-p.amount:p.amount);});
  const cust={};live.forEach(o=>{const n=custName(o.customerId);cust[n]=(cust[n]||0)+o.total;});
  const sc=STATUSES.map(([k,l])=>[l,db.orders.filter(o=>o.status===k&&inR(o.orderDate)).length]);
  const list=obj=>Object.entries(obj).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="line"><span>${esc(k)}</span><b>${inr(v)}</b></div>`).join('')||'<div class="muted">No data in this range.</div>';
  return pageHead('Reports','Pick a date range to see sales and collections')+
    `<form class="card" data-form="report"><div class="form-grid"><div><label>From</label><input type="date" name="from" value="${rFrom}"></div><div><label>To</label><input type="date" name="to" value="${rTo}"></div></div><button class="btn sec btn-block" style="margin-top:14px">Apply date range</button></form>`+
    `<div class="grid4">${kpi('Sales',inr(sales),'','receipt')}${kpi('Orders',live.length,'','clipboard-list')}${kpi('Collections',inr(collected),'','wallet')}${kpi('Outstanding now',inr(outNow),outNow>0?'red':'','circle-alert')}</div>`+
    `<div class="page-actions" style="margin:12px 0"><button class="btn ghost" data-act="csv" data-k="orders">${ICON('download')} Orders (CSV)</button><button class="btn ghost" data-act="csv" data-k="payments">${ICON('download')} Payments (CSV)</button></div>`+
    `<h2>Daily sales</h2><div class="card">${list(daily)}</div>`+
    `<h2>Product-wise sales</h2><div class="card">${list(prod)}</div>`+
    `<h2>Customer-wise sales</h2><div class="card">${list(cust)}</div>`+
    `<h2>Collections by account</h2><div class="card">${list(byAcc)}</div>`+`<h2>Order status</h2><div class="card">${sc.map(([l,n])=>`<div class="line"><span>${l}</span><b>${n}</b></div>`).join('')}</div>`+
    `<h2>Cancelled orders</h2><div class="card">${cancelled.map(o=>`<div class="line"><span>${esc(o.orderNo)} · ${esc(custName(o.customerId))}</span><b>${inr(o.total)}</b></div>`).join('')||'<div class="muted">None in this range.</div>'}</div>`;
}
function toCSV(rows){return rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');}
function exportCSV(kind){
  if(!can('reports'))return deny();
  const inR=d=>d>=rFrom&&d<=rTo;
  let rows;
  if(kind==='orders'){
    rows=[['Order No','Order Date','Customer','Status','Total (Rs)','Paid (Rs)','Balance (Rs)']];
    db.orders.filter(o=>inR(o.orderDate)).forEach(o=>{const f=fin(o);rows.push([o.orderNo,o.orderDate,custName(o.customerId),SL[o.status],(o.total/100).toFixed(2),(f.paid/100).toFixed(2),(f.bal/100).toFixed(2)]);});
  }else{
    rows=[['Payment No','Date','Customer','Method','Reference','Type','Account','Amount (Rs)']];
    db.payments.filter(p=>inR(p.date)).forEach(p=>rows.push([p.paymentNo,p.date,custName(p.customerId),METHOD_LABEL[p.method],p.ref,p.isReversal?'Reversal':'Payment',accName(p.accountId),((p.isReversal?-p.amount:p.amount)/100).toFixed(2)]));
  }
  const blob=new Blob([toCSV(rows)],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=kind+'-'+rFrom+'-to-'+rTo+'.csv';a.click();
  toast('CSV downloaded');
}

/* ---------- order tracking (public, for customers) ---------- */
const CUST_MSG={RECEIVED:'We have received your order and will start on it soon.',WASHING:'Your clothes are being washed.',PROCESSING:'Your clothes are being processed.',IRONING:'Your clothes are being ironed.',READY:'Your order is ready.',DELIVERED:'Your order has been delivered. Thank you!',CANCELLED:'This order was cancelled. Please contact the shop if you have questions.'};
function renderTrack(){
  const q=new URLSearchParams((location.hash.split('?')[1])||'');
  const app=document.getElementById('app');
  app.innerHTML=`<div class="public"><div class="row" style="margin:18px 0 10px"><a href="#/" class="muted small" style="text-decoration:none">← Staff login</a></div>
    <h1>Track your order</h1><p class="muted" style="margin:6px 0 10px">Enter the tracking ID from your receipt or message.</p>
    <form class="card" data-form="track"><label>Tracking ID</label><input name="t" value="${esc(fmtTrackId(q.get('t')||''))}" placeholder="XXXX-XXXX-XX" autocapitalize="characters" autocomplete="off" spellcheck="false">
    <button class="btn btn-block" style="margin-top:16px">Track order</button></form><div id="trackRes"></div></div>`;
  if(window.lucide)window.lucide.createIcons();
  if(normTrackId(q.get('t')).length===10)doTrack(q.get('t'));
}
async function doTrack(tid){
  const res=document.getElementById('trackRes');if(!res)return;
  const id=normTrackId(tid);
  if(id.length!==10){res.innerHTML='<div class="card" style="margin-top:14px">Enter the 10-character tracking ID, for example XXXX-XXXX-XX.</div>';return;}
  res.innerHTML='<div class="card muted" style="margin-top:14px">Checking your order…</div>';
  let d=null;
  try{
    const snap=await getDoc(doc(fdb,'laundryTrack',fmtTrackId(id)));
    d=snap.exists()?snap.data():null;
  }catch(err){
    console.error(err);
    res.innerHTML='<div class="card" style="margin-top:14px">We could not load your order right now. Please try again shortly.</div>';return;
  }
  if(!d){res.innerHTML='<div class="card" style="margin-top:14px">No order matches this tracking ID. Check it and try again.</div>';return;}
  res.innerHTML=trackCardHTML(d);
  if(window.lucide)window.lucide.createIcons();
}
function trackCardHTML(d){
  const cancelled=d.status==='CANCELLED';
  const idx=FLOW.indexOf(d.status);
  const at={};(d.stages||[]).forEach(s=>{at[s.to]=s.at;});
  const timeline=cancelled?'':FLOW.map((s,i)=>{
    const done=i<=idx;
    return `<div class="line" style="${done?'':'opacity:.5'}"><span>${done?'<b>'+esc(SL[s])+'</b>':esc(SL[s])}</span><span class="muted small" style="text-align:right">${at[s]?fdt(at[s]):(done?'':'Pending')}</span></div>`;
  }).join('');
  const expLabel=d.status==='DELIVERED'?'':(d.status==='READY'?'Ready for delivery':'Expected by');
  return `<div class="card" style="margin-top:14px">
    <div class="row"><b>${esc(d.orderNo)}</b>${statusBadge(d.status)}</div>
    <p style="margin:12px 0 4px;font-weight:650">${esc(CUST_MSG[d.status]||'')}</p>
    <div class="muted small" style="margin-bottom:14px">Ordered ${fdate(d.orderDate)}${d.expectedDate&&!cancelled&&d.status!=='DELIVERED'?' · '+esc(expLabel)+' '+fdate(d.expectedDate):''}</div>
    ${stepper(d.status)}
    ${timeline?`<h2 style="margin:18px 0 8px">Progress</h2><div class="card flush">${timeline}</div>`:''}
    <h2 style="margin:18px 0 8px">Items</h2>
    <div class="card flush">${d.items.map(i=>`<div class="line"><span>${esc(i.name)} (${esc(i.qty)} ${esc(i.unit)})</span><span>${inr(i.amount)}</span></div>`).join('')}
      <div class="line grand"><span>Total</span><b>${inr(d.total)}</b></div>
      <div class="line"><span>Payment</span>${payBadge(d.payStatus)}</div>
      <div class="line"><span>Balance due</span><b class="${d.balance>0?'err':''}">${inr(d.balance)}</b></div>
    </div>
    ${d.phone?`<p class="muted small" style="margin-top:14px;text-align:center">Questions? Call ${esc(d.shop)} at <a href="tel:${esc(d.phone)}">${esc(d.phone)}</a></p>`:''}
  </div>`;
}

/* ---------- sign-in & staff access ---------- */
document.addEventListener('submit',e=>{
  const f=e.target;if(!f.dataset||f.dataset.form!=='signin')return;
  e.preventDefault();
  const fd=new FormData(f);const btn=f.querySelector('button');const msg=f.querySelector('.auth-err');
  msg.textContent='';btn.disabled=true;btn.textContent='Signing in…';
  const map={'auth/invalid-credential':'Email or password is incorrect.','auth/wrong-password':'Email or password is incorrect.','auth/user-not-found':'Email or password is incorrect.','auth/invalid-email':'Enter a valid email address.','auth/too-many-requests':'Too many attempts. Wait a few minutes and try again.','auth/network-request-failed':'No internet connection.'};
  setPersistence(auth,fd.get('remember')==='on'?browserLocalPersistence:browserSessionPersistence).then(()=>signInWithEmailAndPassword(auth,String(fd.get('email')||'').trim(),String(fd.get('password')||''))).catch(err=>{
    msg.textContent=map[err.code]||'Could not sign in. Please try again.';
    btn.disabled=false;btn.textContent='Sign in';
  });
});
document.addEventListener('submit',e=>{
  const f=e.target;if(!f.dataset||f.dataset.form!=='staff')return;
  e.preventDefault();
  safe(()=>{
    if(!user||user.role!=='ADMIN')return deny();
    const fd=new FormData(f);
    const email=String(fd.get('email')||'').trim().toLowerCase();
    const role=PERMS[fd.get('role')]?fd.get('role'):'STAFF';
    if(!/^\S+@\S+\.\S+$/.test(email))throw new Error('Enter a valid email address');
    if(db.staff.some(x=>x.email===email))throw new Error('This person already has access');
    db.staff.push({email,role});audit('Staff access given',email+' as '+ROLE_NAME[role]);save();toast('Access given to '+email);render();
  });
});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-staff-remove]');if(!el)return;
  e.preventDefault();
  safe(async()=>{
    if(user.role!=='ADMIN')return deny();
    const email=el.dataset.staffRemove;
    if(!await confirmAction('This person will no longer be able to sign in to Laundry Manager.','Remove access for '+email+'?'))return;
    db.staff=db.staff.filter(x=>x.email!==email);audit('Staff access removed',email);save();toast('Access removed');render();
  });
});

/* ---------- password: reset & change ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-auth-view]');if(!el)return;
  e.preventDefault();authView=el.dataset.authView;render();
});
document.addEventListener('submit',e=>{
  const f=e.target;if(!f.dataset||f.dataset.form!=='reset')return;
  e.preventDefault();
  const email=String(new FormData(f).get('email')||'').trim();
  const btn=f.querySelector('button'),ok=f.querySelector('.auth-ok'),err=f.querySelector('.auth-err');
  ok.textContent='';err.textContent='';btn.disabled=true;btn.textContent='Sending…';
  sendPasswordResetEmail(auth,email).then(()=>{
    ok.textContent='If an account exists for '+email+', a reset link is on its way. Check your inbox and spam folder.';
  }).catch(x=>{
    if(x.code==='auth/invalid-email')err.textContent='Enter a valid email address.';
    else if(x.code==='auth/too-many-requests')err.textContent='Too many requests. Wait a few minutes and try again.';
    else if(x.code==='auth/network-request-failed')err.textContent='No internet connection.';
    else ok.textContent='If an account exists for '+email+', a reset link is on its way.';
  }).finally(()=>{btn.disabled=false;btn.textContent='Send reset link';});
});
document.addEventListener('submit',async e=>{
  const f=e.target;if(!f.dataset||f.dataset.form!=='changepw')return;
  e.preventDefault();
  const fd=new FormData(f);const msg=f.querySelector('.auth-err');const btn=f.querySelector('button');
  msg.textContent='';
  const cur=String(fd.get('current')||''),nx=String(fd.get('next')||''),cf=String(fd.get('confirm')||'');
  if(nx.length<6){msg.textContent='The new password must be at least 6 characters.';return;}
  if(nx!==cf){msg.textContent='The new passwords do not match.';return;}
  if(nx===cur){msg.textContent='Choose a password different from your current one.';return;}
  const cu=auth.currentUser;if(!cu){msg.textContent='Please sign in again.';return;}
  btn.disabled=true;
  try{
    await reauthenticateWithCredential(cu,EmailAuthProvider.credential(cu.email,cur));
    await updatePassword(cu,nx);
    f.reset();audit('Password changed',cu.email,ROLE_NAME[user.role]);save();toast('Password changed');
  }catch(x){
    const m={'auth/invalid-credential':'Current password is incorrect.','auth/wrong-password':'Current password is incorrect.','auth/weak-password':'That password is too weak. Choose a longer one.','auth/requires-recent-login':'For security, sign out and sign in again, then retry.','auth/too-many-requests':'Too many attempts. Wait a few minutes and try again.','auth/network-request-failed':'No internet connection.'};
    msg.textContent=m[x.code]||'Could not change the password. Please try again.';
  }finally{btn.disabled=false;}
});

/* ---------- UI interactions (added alongside the core actions) ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-pf],[data-of],[data-pick-cust],[data-pick-prod],[data-qpre],[data-dd],[data-pfull]');
  if(!el)return;
  e.preventDefault();
  safe(()=>{
    if(el.dataset.pf){pfilter=el.dataset.pf;location.hash=el.getAttribute('href');render();return;}
    if(el.dataset.of){ofilter=el.dataset.of;location.hash=el.getAttribute('href');render();return;}
    if(!draft)return;
    readStep();
    if(el.dataset.pickCust)draft.customerId=el.dataset.pickCust;
    else if(el.dataset.pickProd)draft.addProd=el.dataset.pickProd;
    else if(el.dataset.qpre)draft.addQty=el.dataset.qpre;
    else if(el.dataset.dd)draft.expected=addDays(draft.orderDate||today(),Number(el.dataset.dd));
    else if(el.dataset.pfull)draft.advance=(currentTotals().total/100).toFixed(2);
    render();
  });
});
document.addEventListener('submit',e=>{
  const f=e.target;if(!f.dataset||f.dataset.form!=='account')return;
  e.preventDefault();
  safe(()=>{
    const fd=new FormData(f);
    const name=String(fd.get('name')||'').trim();if(!name)throw new Error('Enter an account nickname');
    const a={id:uid('a'),name,type:fd.get('type')==='CASH'?'CASH':'BANK',bank:String(fd.get('bank')||'').trim(),
      last4:String(fd.get('last4')||'').replace(/\D/g,'').slice(-4),openingPaise:parseRupees(fd.get('opening')),active:true,createdAt:new Date().toISOString()};
    db.accounts.push(a);audit('Account added',name);save();toast('Account "'+name+'" added');render();
  });
});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-acc-toggle]');if(!el)return;
  e.preventDefault();
  safe(()=>{
    const a=db.accounts.find(x=>x.id===el.dataset.accToggle);if(!a)return;
    a.active=!a.active;audit('Account '+(a.active?'shown':'hidden'),a.name);save();toast('Account '+(a.active?'shown in':'hidden from')+' new payments');render();
  });
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(!t.matches||!t.matches('select[name=method],select[data-d=method]'))return;
  const scope=t.closest('form')||document;
  const sel=scope.querySelector('select[name=accountId],select[data-d=accountId]');
  if(sel)sel.innerHTML=accOptionsHTML(t.value);
});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-dr]');if(!el)return;
  e.preventDefault();
  const st=drState(el.dataset.dr);st.p=el.dataset.dp;
  if(st.p==='custom'){st.from=st.from||today().slice(0,8)+'01';st.to=st.to||today();}
  render();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.drFrom){drState(t.dataset.drFrom).from=t.value;render();}
  else if(t.dataset&&t.dataset.drTo){drState(t.dataset.drTo).to=t.value;render();}
});
document.addEventListener('input',e=>{
  if(e.target.dataset&&e.target.dataset.live==='wcust'){
    const t=document.getElementById('wcustList');if(t)t.innerHTML=custPickHTML(e.target.value);
  }
});

/* ---------- actions & forms ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  e.preventDefault();
  const a=el.dataset.act;
  if(el.matches('[data-drawer-link]'))closeDrawer();
  safe(()=>act(a,el));
});
async function act(a,el){
  switch(a){
    case 'drawer-open':document.body.classList.add('drawer-open');break;
    case 'drawer-close':closeDrawer();break;
    case 'login':{
      const r=el.dataset.r;if(!PERMS[r])return;
      user={role:r};localStorage.setItem(UKEY,r);
      location.hash='#/';render();break;}
    case 'logout':
      closeDrawer();await signOut(auth);user=null;db=null;location.hash='#/';render();break;
    case 'ofilter':ofilter=el.dataset.v;render();break;
    case 'pfilter':pfilter=el.dataset.v;render();break;
    case 'outonly':outOnly=!outOnly;render();break;
    case 'print':{
      const d=document.getElementById('docArea');
      if(d)d.classList.toggle('thermal',el.dataset.t==='1');
      window.print();break;}
    case 'qstatus':setStatus(el.dataset.id,el.dataset.to,'');break;
    case 'cancel':{
      if(!can('cancel'))return deny();
      if(!await confirmAction('This order will be cancelled. This action cannot be undone.','Cancel this order?'))return;
      await cancelOrder(db.orders.find(o=>o.id===el.dataset.id));break;}
    case 'rev':if(!can('payments'))return deny();await reversePayment(el.dataset.id);break;
    case 'ptoggle':{
      if(!can('products'))return deny();
      const p=db.products.find(x=>x.id===el.dataset.id);if(!p)return;
      p.active=!p.active;audit('Product '+(p.active?'activated':'deactivated'),p.name);save();render();break;}
    case 'delcust':{
      if(user.role==='STAFF')return deny();
      const c=db.customers.find(x=>x.id===el.dataset.id);if(!c)return;
      if(db.orders.some(o=>o.customerId===c.id)||db.payments.some(p=>p.customerId===c.id)||c.opening>0){
        toast('This customer has records and cannot be deleted');return;}
      if(!await confirmAction('"'+c.name+'" will be removed permanently. This cannot be undone.','Delete customer?'))return;
      db.customers=db.customers.filter(x=>x.id!==c.id);
      audit('Customer deleted',c.code+' '+c.name);save();toast('Customer deleted');
      location.hash='#/customers';render();break;}
    case 'csv':exportCSV(el.dataset.k);break;
    case 'reset':
      if(user.role!=='ADMIN')return deny();
      if(!await confirmAction('All current demo records will be replaced with the sample data.','Reset demo data?'))return;
      const keepStaff=db.staff;seed();db.staff=keepStaff;save();toast('Demo data reset');render();break;
    case 'wnext':wnext();break;
    case 'wback':readStep();draft.step=Math.max(1,draft.step-1);render();break;
    case 'wadd':{
      readStep();
      const qty=parseQty(draft.addQty);
      priceItems([{productId:draft.addProd,qtyMilli:qty}]);
      draft.items.push({productId:draft.addProd,qtyMilli:qty});
      draft.addQty='';render();break;}
    case 'wremove':readStep();draft.items.splice(Number(el.dataset.i),1);render();break;
    case 'wsave':await wsave();break;
    default:break;
  }
}
function wnext(){
  readStep();const s=draft.step;
  if(s===1&&!draft.customerId)throw new Error('Select or create a customer');
  if(s===2&&!draft.items.length)throw new Error('Add at least one item');
  if(s===3){
    if(!draft.orderDate||!draft.expected)throw new Error('Enter both dates');
    if(draft.expected<draft.orderDate)throw new Error('Delivery date cannot be before the order date');
    parseRupees(draft.discount);parseRupees(draft.extra);
    currentTotals();
  }
  if(s===4){
    const t=currentTotals();const adv=parseRupees(draft.advance);
    if(adv>t.total)throw new Error('Advance cannot be more than the grand total');
    if(adv>0&&draft.method!=='CASH'&&!draft.ref.trim())throw new Error('Enter the reference number for non-cash payments');
  }
  draft.step=s+1;render();
}
async function wsave(){
  readStep();
  const res=placeOrder({customerId:draft.customerId,orderDate:draft.orderDate,expectedDate:draft.expected,
    items:draft.items,discountPaise:parseRupees(draft.discount),extraPaise:parseRupees(draft.extra),
    advancePaise:parseRupees(draft.advance),method:draft.method,ref:draft.ref.trim(),accountId:draft.accountId,
    instructions:draft.instructions.trim(),notes:'',by:ROLE_NAME[user.role],idem:draft.idem,status:'RECEIVED'});
  const ok=await persist(res.dup?'Order already saved':'Order '+res.order.orderNo+' saved');
  if(!ok){render();return;}
  draft=null;
  location.hash='#/orders/'+res.order.id;render();
}

document.addEventListener('submit',e=>{
  const f=e.target;if(!f.dataset||!f.dataset.form)return;
  e.preventDefault();
  safe(()=>handleForm(f.dataset.form,f,new FormData(f)));
});
async function handleForm(name,f,fd){
  switch(name){
    case 'customer':{
      const c=addCustomer(Object.fromEntries(fd));save();toast('Customer '+c.code+' saved');location.hash='#/customers/'+c.id;render();break;}
    case 'wcust':{
      const c=addCustomer(Object.fromEntries(fd));readStep();draft.customerId=c.id;draft.step=2;save();toast('Customer '+c.code+' added');render();break;}
    case 'product':{
      addProduct(Object.fromEntries(fd));save();toast('Product added');render();break;}
    case 'customer-edit':{
      if(!can('customers'))return deny();
      const c=db.customers.find(x=>x.id===f.dataset.id);if(!c)throw new Error('Customer not found');
      const name=String(fd.get('name')||'').trim();if(!name)throw new Error('Customer name is required');
      const mobile=String(fd.get('mobile')||'').replace(/[\s-]/g,'');
      if(!/^\d{10}$/.test(mobile))throw new Error('Enter a 10-digit mobile number');
      if(db.customers.some(x=>x.id!==c.id&&x.mobile===mobile))throw new Error('Another customer already uses this mobile number');
      Object.assign(c,{name,mobile,
        whatsapp:String(fd.get('whatsapp')||'').replace(/[\s-]/g,'')||mobile,
        email:String(fd.get('email')||'').trim(),
        address:String(fd.get('address')||'').trim()});
      audit('Customer updated',c.code+' '+name);save();toast('Customer updated');
      location.hash='#/customers/'+c.id;render();break;}
    case 'itemprice':{
      if(!can('products'))return deny();
      readStep();
      const p=db.products.find(x=>x.id===f.dataset.id);if(!p)throw new Error('Product not found');
      const r=parseRupees(fd.get('rate'));if(r<=0)throw new Error('Price must be greater than zero');
      if(r===p.ratePaise){toast('Price is unchanged');render();break;}
      p.history.push({old:p.ratePaise,new:r,at:new Date().toISOString(),by:ROLE_NAME[user.role]});
      audit('Rate changed',p.name+' '+inr(p.ratePaise)+' to '+inr(r));
      p.ratePaise=r;save();toast('Price updated for '+p.name+'. Past invoices are not affected.');render();break;}
    case 'rate':{
      if(!can('products'))return deny();
      const p=db.products.find(x=>x.id===f.dataset.id);
      const r=parseRupees(fd.get('rate'));if(r<=0)throw new Error('Rate must be greater than zero');
      if(r===p.ratePaise){toast('Rate is unchanged');return;}
      p.history.push({old:p.ratePaise,new:r,at:new Date().toISOString(),by:ROLE_NAME[user.role]});
      audit('Rate changed',p.name+' '+inr(p.ratePaise)+' to '+inr(r));
      p.ratePaise=r;save();toast('Rate updated. Past invoices are not affected.');render();break;}
    case 'status':setStatus(f.dataset.id,fd.get('to'),fd.get('note'));break;
    case 'pay':{
      if(!can('payments'))return deny();
      const r=recordPayment({invoiceId:fd.get('inv'),amount:parseRupees(fd.get('amount')),method:fd.get('method'),
        ref:String(fd.get('ref')||'').trim(),by:ROLE_NAME[user.role],idem:fd.get('idem'),accountId:fd.get('accountId')});
      if(r.dup){toast('This payment was already recorded');}
      else{
        const ok=await persist('Payment '+r.payment.paymentNo+' of '+inr(r.payment.amount)+' recorded');
        if(ok)payIdem=uid('k');
      }
      render();break;}
    case 'company':{
      if(!can('settings')&&user.role!=='ADMIN'&&user.role!=='MANAGER')return deny();
      db.settings.name=String(fd.get('name')||'').trim()||db.settings.name;
      db.settings.address=String(fd.get('address')||'').trim();
      db.settings.phone=String(fd.get('phone')||'').trim();
      audit('Company profile updated','');save();toast('Profile saved');render();break;}
    case 'report':rFrom=fd.get('from')||rFrom;rTo=fd.get('to')||rTo;render();break;
    case 'track':doTrack(fd.get('t'));break;
    default:break;
  }
}
document.addEventListener('input',e=>{
  const kind=e.target.dataset.live;if(!kind)return;
  const target=document.getElementById(e.target.dataset.target);if(!target)return;
  const v=e.target.value;
  if(kind==='cust')target.innerHTML=custListHTML(v);
  else if(kind==='ord')target.innerHTML=ordListHTML(v);
  else if(kind==='inv')target.innerHTML=invListHTML(v);
  else if(kind==='pend')target.innerHTML=pendListHTML(v);
  else if(kind==='ct')target.innerHTML=ctListHTML(v,e.target.dataset.f);
});

/* ---------- start ---------- */
let unsubLive=null;
function stopLive(){if(unsubLive){unsubLive();unsubLive=null;}}
// Returns 'ok', 'denied' or 'error'.
async function loadWorkspace(fbUser){
  try{
    const snap=await getDoc(DOC_REF);
    if(snap.exists()){db=snap.data();}
    else{seed();await commit();}
  }catch(err){
    console.error(err);
    document.getElementById('app').innerHTML='<div class="login-wrap"><div class="login-card"><h2>Cannot load your data</h2><p class="muted">Check your internet connection and try again.</p><button class="btn btn-block" onclick="location.reload()">Reload</button></div></div>';
    return 'error';
  }
  if(!db.accounts)db.accounts=defaultAccounts();
  (db.orders||[]).forEach(o=>{if(!o.trackId)o.trackId=trackIdFor(o.id);});
  if(!db.staff)db.staff=[];
  const email=String(fbUser.email||'').toLowerCase();
  let entry=db.staff.find(x=>x.email===email);
  if(!entry&&!db.staff.length){entry={email,role:'ADMIN'};db.staff.push(entry);audit('First administrator set up',email,'System');save();}
  if(!entry){
    await signOut(auth);user=null;db=null;
    toast('This account is not set up for Laundry Manager. Ask an administrator to add you.');
    return 'denied';
  }
  user={role:entry.role,email};
  stopLive();
  unsubLive=onSnapshot(DOC_REF,s=>{if(s.metadata.hasPendingWrites||!s.exists())return;db=s.data();render();},err=>console.error(err));
  // Publish customer tracking records for existing orders (their IDs were just created on load).
  const sigBefore=JSON.stringify(db.trackSig||{});
  const withIdBefore=db.orders.filter(o=>o.trackId).length;
  await publishTracking();
  if(JSON.stringify(db.trackSig||{})!==sigBefore||withIdBefore!==db.orders.length)await commit().catch(err=>console.error(err));
  return 'ok';
}
function boot(){
  document.getElementById('app').innerHTML='<div class="login-wrap"><div class="login-card"><h2>Laundry Manager</h2><p class="muted">Checking your sign-in…</p></div></div>';
  onAuthStateChanged(auth,async fbUser=>{
    if(!fbUser){stopLive();user=null;db=null;render();return;}
    const result=await loadWorkspace(fbUser);
    if(result==='error')return;
    render();
  });
  window.addEventListener('hashchange',()=>{closeDrawer();render();});
}

boot();
</script>
