<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Laundry Manager - Demo</title>

<style>
*{box-sizing:border-box}
:root{--p:#0f766e;--bg:#f3f6f6;--card:#fff;--tx:#111827;--mu:#6b7280;--bd:#e5e7eb;--red:#b91c1c}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:16px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit}
a{color:var(--p)}
.btn{min-height:44px;padding:0 16px;border:0;border-radius:10px;background:var(--p);color:#fff;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.sec{background:#e5f2f1;color:var(--p)}
.btn.danger{background:#fee2e2;color:var(--red)}
.btn.ghost{background:#fff;color:var(--tx);border:1px solid var(--bd)}
.btn.block{width:100%}
input,select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}
label{display:block;font-size:14px;color:var(--mu);margin:12px 0 4px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.cardlink{display:block;color:inherit;text-decoration:none}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two-col{display:grid;grid-template-columns:1fr;gap:12px}
.kpi .v{font-size:20px;font-weight:700}
.kpi .l{font-size:13px;color:var(--mu)}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:#e5e7eb;white-space:nowrap}
.b-RECEIVED{background:#e0e7ff;color:#3730a3}.b-WASHING{background:#cffafe;color:#155e75}.b-PROCESSING{background:#fef3c7;color:#92400e}.b-IRONING{background:#fde68a;color:#78350f}.b-READY{background:#dcfce7;color:#166534}.b-DELIVERED{background:#d1fae5;color:#065f46}.b-CANCELLED{background:#fee2e2;color:#991b1b}
.b-UNPAID{background:#fee2e2;color:#991b1b}.b-PARTIAL{background:#fef3c7;color:#92400e}.b-PAID{background:#dcfce7;color:#166534}
.line{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.line:last-child{border-bottom:0}
.muted{color:var(--mu);font-size:14px}
.overdue{border-left:4px solid var(--red)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:12px 0}
.chip{white-space:nowrap;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--bd);background:#fff;display:inline-flex;align-items:center;text-decoration:none;color:var(--tx);font-size:14px}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
.bar{height:10px;background:#e5e7eb;border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--p)}
.chart-row{display:grid;grid-template-columns:70px 1fr 90px;gap:8px;align-items:center;font-size:13px;margin:8px 0}
h1{font-size:24px;margin:8px 0 12px}
h2{font-size:18px;margin:18px 0 8px}
.err{color:var(--red)}
.tl{list-style:none;padding:0;margin:0}
.tl li{display:flex;gap:12px;padding:8px 0;color:var(--mu)}
.tl li i{width:14px;height:14px;border-radius:50%;background:#d1d5db;flex:0 0 14px;margin-top:4px}
.tl li.done{color:var(--tx)}
.tl li.done i{background:var(--p)}
.tl li.cur i{background:#d97706}
.steps{display:flex;gap:6px;margin:8px 0 16px}
.steps span{flex:1;height:6px;border-radius:3px;background:#d1d5db}
.steps span.on{background:var(--p)}
.doc{background:#fff;padding:20px;border-radius:8px;border:1px solid var(--bd)}
.doc.thermal{width:80mm;max-width:100%;font-family:monospace;font-size:12px;margin:0 auto;padding:8px}
.doc table{width:100%;border-collapse:collapse;margin-top:10px}
.doc td,.doc th{padding:4px 2px;text-align:left;vertical-align:top}
.doc .r{text-align:right}
.doc hr{border:0;border-top:1px dashed #9ca3af;margin:10px 0}
.scroll{overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#111827;color:#fff;padding:12px 16px;border-radius:10px;z-index:99;font-size:14px;max-width:92%}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login .card{width:100%;max-width:380px}
.lr{display:grid;gap:10px;margin-top:12px}
.nav-bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.nav-bottom a{min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--mu);text-decoration:none;flex:1}
.nav-bottom a.on{color:var(--p);font-weight:700}
.nav-bottom .fab{background:var(--p);color:#fff;border-radius:50%;width:52px;height:52px;flex:0 0 52px;margin-top:-22px;font-size:28px;font-weight:300;flex:0 0 auto}
.nav-bottom .fab span{color:#fff}
.side{display:none}
.main{padding:14px 14px 110px;max-width:1100px;margin:0 auto}
.shell{min-height:100vh}
@media(min-width:700px){.grid4{grid-template-columns:repeat(4,1fr)}.two-col{grid-template-columns:1fr 1fr}}
@media(min-width:900px){
 .shell{display:grid;grid-template-columns:230px 1fr}
 .side{display:block;background:#0f3d3a;color:#fff;padding:20px 12px;position:sticky;top:0;height:100vh;overflow:auto}
 .side a{display:block;color:#d1ecea;text-decoration:none;padding:10px 12px;border-radius:8px;margin:2px 0;font-size:15px}
 .side a.on,.side a:hover{background:#17625c;color:#fff}
 .side h4{color:#7fc3bc;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:16px 12px 6px}
 .side .brand{font-size:17px;font-weight:700;padding:0 12px 8px}
 .nav-bottom{display:none}
 .main{padding:24px 28px 40px}
}
@media print{
 body *{visibility:hidden}
 .doc,.doc *{visibility:visible}
 .doc{position:absolute;left:0;top:0;width:100%;border:0;padding:0}
 .doc.thermal{width:80mm}
 .nav-bottom,.side,.toast{display:none!important}
}

/* Permanently hide Netlify deployment badges, including dynamically injected badges */
#netlify-badge,
.nl-wrap,
.netlify-badge,
[data-netlify-badge],
netlify-badge,
iframe#netlify-badge,
iframe[src*="netlify" i],
iframe[title*="netlify" i],
a[href*="app.netlify.com" i] {
  display: none !important;
  visibility: hidden !important;
  opacity: 0 !important;
  pointer-events: none !important;
}

/* Modern responsive UI layer */
:root{--p:#0f766e;--p-dark:#115e59;--bg:#f5f8f8;--card:#fff;--tx:#142321;--mu:#64748b;--bd:#e5eaf0;--red:#b91c1c;--shadow:0 8px 26px rgba(15,40,38,.06)}
html{overflow-x:hidden;scroll-behavior:smooth}
body{overflow-x:hidden;background:linear-gradient(180deg,#f7fbfa 0%,#f3f7f7 100%%);letter-spacing:-.01em}
#app,.shell,.main{min-width:0;max-width:100%}

.app-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px;padding:14px 18px;background:rgba(255,255,255,.88);border:1px solid rgba(226,232,240,.9);border-radius:18px;box-shadow:var(--shadow);backdrop-filter:blur(12px)}

label{font-weight:600}
h1{font-size:clamp(22px,3vw,30px);letter-spacing:-.035em;font-weight:800;overflow-wrap:anywhere}

.side{background:linear-gradient(180deg,#103f3b,#0c302e);padding:24px 14px}
.side .brand,.drawer-head .brand{display:flex;align-items:center;gap:10px;overflow-wrap:anywhere}
.brand-mark{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 34px;border-radius:11px;background:#d8f4ed;color:#0f766e;font-size:19px}
.side .brand{color:#fff;font-size:15px;padding:0 10px 18px}
.side a{border-radius:11px;padding:11px 12px;transition:background .15s ease;display:flex;align-items:center;gap:11px}.nav-icon{width:18px;height:18px;flex:0 0 18px;stroke-width:1.9}
.side a.on,.side a:hover{background:rgba(255,255,255,.13)}

.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:18px;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:14px}

.drawer-head .brand span:last-child{overflow-wrap:anywhere}

<script>
/* Keep Netlify badge hidden even if a script injects it after page load. */
(function () {
  const selectors = '#netlify-badge, .nl-wrap, .netlify-badge, [data-netlify-badge], netlify-badge, iframe[src*="netlify" i], iframe[title*="netlify" i], a[href*="app.netlify.com" i]';
  function hideNetlifyBadge(root) {
    if (root.nodeType !== 1) return;
    if (root.matches && root.matches(selectors)) root.style.setProperty('display', 'none', 'important');
    if (root.querySelectorAll) root.querySelectorAll(selectors).forEach(el => el.style.setProperty('display', 'none', 'important'));
  }
  hideNetlifyBadge(document.documentElement);
  new MutationObserver(records => records.forEach(record => record.addedNodes.forEach(hideNetlifyBadge)))
    .observe(document.documentElement, { childList: true, subtree: true });
})();
</script>

/* ==========================================================
   Laundry Manager - single-file demo

const KEY='laundry_demo_v2', UKEY='laundry_demo_user_v2';
const STATUSES=[['RECEIVED','Order Received'],['WASHING','Washing'],['PROCESSING','Processing'],['IRONING','Ironing'],['READY','Ready for Delivery'],['DELIVERED','Delivered'],['CANCELLED','Cancelled']];

 {h:'#/',l:'Dashboard',i:'🏠'},

 {h:'#/payments',l:'Payments',p:'payments',i:'💰'},
 {h:'#/outstanding',l:'Outstanding',p:'payments',i:'⚠️'},
 {g:'Reports',h:'#/reports',l:'Reports',p:'reports',i:'📊'},
 {g:'Settings',h:'#/settings',l:'Settings',i:'⚙️'}
];

let user=null, db=null, draft=null;
let ofilter='ALL', pfilter='pending', outOnly=false, rFrom='', rTo='', payIdem=uid('k');

/* ---------- helpers ---------- */
function uid(p){return (p||'')+Math.random().toString(36).slice(2,10)+Date.now().toString(36);}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function inr(p){const s=p<0?'-':'';const a=Math.abs(p);return s+'₹'+Math.floor(a/100).toLocaleString('en-IN')+'.'+String(a%100).padStart(2,'0');}
function parseRupees(s){const t=String(s??'').trim();if(t==='')return 0;if(!/^\d+(\.\d{1,2})?$/.test(t))throw new Error('Enter a valid amount in rupees, e.g. 80 or 12.50');const [w,f='']=t.split('.');return Number(w)*100+Number(f.padEnd(2,'0'));}
function parseQty(s){const t=String(s??'').trim();if(!/^\d+(\.\d{1,3})?$/.test(t))throw new Error('Enter a valid quantity, e.g. 5 or 2.5');const [w,f='']=t.split('.');const q=Number(w)*1000+Number(f.padEnd(3,'0'));if(q<=0)throw new Error('Quantity must be greater than zero');return q;}
function lineAmount(q,r){return Math.floor((q*r+500)/1000);}
function qtyText(q,unit){return unit==='PCS'?String(q/1000):(q/1000).toFixed(3).replace(/\.?0+$/,'');}
function p2(n){return String(n).padStart(2,'0');}
function fmtISO(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function today(){return fmtISO(new Date());}
function addDays(iso,n){const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return fmtISO(d);}
function fdate(iso){return iso?new Date(iso+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'';}
function fdt(iso){return iso?new Date(iso).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';}
function nextNo(key,prefix){db.counters[key]=(db.counters[key]||0)+1;return prefix+'-'+String(db.counters[key]).padStart(4,'0');}
function audit(action,detail,by){db.audit.unshift({at:new Date().toISOString(),by:by||(user?ROLE_NAME[user.role]:'System'),action,detail});if(db.audit.length>200)db.audit.length=200;}
function can(p){if(!user)return false;const r=PERMS[user.role];return r==='*'||r.includes(p);}
function custName(id){const c=db.customers.find(x=>x.id===id);return c?c.name:'Unknown';}
function toast(msg){const old=document.querySelector('.toast');if(old)old.remove();const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2800);}
function closeDrawer(){document.body.classList.remove('drawer-open');}
function showDialog({title='Please confirm',message='',confirmText='Confirm',cancelText='Cancel',danger=false,input=false,placeholder='Enter details'}={}){
  return new Promise(resolve=>{
    const root=document.getElementById('dialog-root');
    if(!root){resolve(null);return;}
    root.innerHTML='<div class="dialog-backdrop"><section class="dialog-card" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialog-icon '+(danger?'danger':'')+'">'+(danger?'!':'✓')+'</div><h2 id="dialogTitle">'+esc(title)+'</h2><p>'+esc(message)+'</p>'+
      (input?'<label class="dialog-label">Reason</label><textarea id="dialogInput" rows="3" placeholder="'+esc(placeholder)+'"></textarea>':'')+
      '<div class="dialog-actions"><button type="button" class="btn ghost" data-dialog="cancel">'+esc(cancelText)+'</button><button type="button" class="btn '+(danger?'danger-solid':'')+'" data-dialog="confirm">'+esc(confirmText)+'</button></div></section></div>';
    const finish=value=>{root.innerHTML='';resolve(value);};
    root.querySelector('[data-dialog="cancel"]').addEventListener('click',()=>finish(null));
    root.querySelector('[data-dialog="confirm"]').addEventListener('click',()=>finish(input?(root.querySelector('#dialogInput').value.trim()||null):true));
    root.querySelector('.dialog-backdrop').addEventListener('click',e=>{if(e.target===e.currentTarget)finish(null);});
    if(input)root.querySelector('#dialogInput').focus();
  });
}
async function confirmAction(message,title='Are you sure?'){return !!(await showDialog({title,message,confirmText:'Yes, continue',danger:true}));}
function safe(fn){
  try{const r=fn();if(r&&typeof r.then==='function')r.catch(e=>toast(e.message));}
  catch(e){toast(e.message);}
}
function deny(){toast('Your role does not have permission for this action');}
function statusBadge(s){return '<span class="badge b-'+s+'">'+esc(SL[s])+'</span>';}
function payBadge(ps){return '<span class="badge b-'+ps+'">'+esc(PS_LABEL[ps])+'</span>';}
function isPending(o){return o.status!=='DELIVERED'&&o.status!=='CANCELLED';}
function isOverdue(o){return isPending(o)&&o.expectedDate<today();}

/* ---------- persistence (Firebase Firestore) ---------- */
function cleanData(){return JSON.parse(JSON.stringify(db));}
async function commit(){await setDoc(DOC_REF,cleanData());}
// Non-financial changes: saved in the background, with an error message if it fails.
function save(){commit().catch(err=>{console.error(err);toast('Could not save to the server. Check your connection.');});}
// Financial changes: only confirmed as successful after the server accepts them.
async function persist(msg){
  try{await commit();if(msg)toast(msg);return true;}
  catch(err){console.error(err);toast('Not saved: no connection to the server. Nothing was recorded.');await reloadFromServer();return false;}
}
async function reloadFromServer(){
  try{const s=await getDoc(DOC_REF);if(s.exists())db=s.data();}catch(e){}
  render();
}

/* ---------- core domain logic ---------- */
function addProduct(o){
  const name=(o.name||'').trim();if(!name)throw new Error('Product name is required');
  if(!['KG','PCS'].includes(o.unit))throw new Error('Choose a unit (KG or PCS)');
  const rate=parseRupees(o.rate);if(rate<=0)throw new Error('Rate must be greater than zero');
  const p={id:uid('p'),name,category:(o.category||'General').trim(),unit:o.unit,ratePaise:rate,description:(o.description||'').trim(),active:true,history:[]};
  db.products.push(p);audit('Product added',name+' '+inr(rate)+'/'+o.unit);return p;
}
function addCustomer(o){
  const name=(o.name||'').trim();if(!name)throw new Error('Customer name is required');
  const mobile=String(o.mobile||'').replace(/[\s-]/g,'');
  if(!/^\d{10}$/.test(mobile))throw new Error('Enter a 10-digit mobile number');
  if(db.customers.some(c=>c.mobile===mobile))throw new Error('A customer with this mobile already exists');
  const c={id:uid('c'),code:nextNo('customer','CUST'),name,mobile,
    whatsapp:String(o.whatsapp||mobile).replace(/[\s-]/g,''),email:(o.email||'').trim(),
    address:(o.address||'').trim(),opening:parseRupees(o.opening||'')};
  db.customers.push(c);audit('Customer created',c.code+' '+name);return c;
}
function priceItems(raw){
  if(!raw.length)throw new Error('Add at least one item');
  return raw.map(i=>{
    const p=db.products.find(x=>x.id===i.productId);
    if(!p)throw new Error('Product not found');
    if(!p.active)throw new Error(p.name+' is inactive');
    if(i.qtyMilli<=0)throw new Error('Quantity must be greater than zero');
    if(p.unit==='PCS'&&i.qtyMilli%1000)throw new Error(p.name+': pieces must be whole numbers');
    return {productId:p.id,name:p.name,unit:p.unit,qtyMilli:i.qtyMilli,rate:p.ratePaise,amount:lineAmount(i.qtyMilli,p.ratePaise)};
  });
}
function totalsOf(items,discount,extra){
  const subtotal=items.reduce((s,i)=>s+i.amount,0);
  if(discount<0||extra<0)throw new Error('Discount and charges cannot be negative');
  if(discount>subtotal+extra)throw new Error('Discount cannot exceed the order value');
  return {items,subtotal,discount,extra,total:subtotal-discount+extra};
}
function netPaid(invId){return db.payments.filter(p=>p.invoiceId===invId).reduce((s,p)=>s+(p.isReversal?-p.amount:p.amount),0);}
function invOf(orderId){return db.invoices.find(i=>i.orderId===orderId);}
function fin(o){
  const inv=invOf(o.id);const paid=netPaid(inv.id);const bal=inv.total-paid;
  const ps=paid===0?'UNPAID':(bal===0?'PAID':'PARTIAL');
  return {inv,paid,bal,ps};
}
function custStats(cid){
  const c=db.customers.find(x=>x.id===cid);
  const ords=db.orders.filter(o=>o.customerId===cid&&o.status!=='CANCELLED');
  const billed=ords.reduce((s,o)=>s+o.total,0);
  const paid=db.payments.filter(p=>p.customerId===cid).reduce((s,p)=>s+(p.isReversal?-p.amount:p.amount),0);
  return {orders:ords.length,billed,paid,bal:(c?c.opening:0)+billed-paid};
}
function recordPayment(p){
  const dup=db.payments.find(x=>x.idem===p.idem);if(dup)return {dup:true,payment:dup};
  const inv=db.invoices.find(i=>i.id===p.invoiceId);if(!inv)throw new Error('Invoice not found');
  const o=db.orders.find(x=>x.id===inv.orderId);
  if(o.status==='CANCELLED')throw new Error('Cannot take payment on a cancelled order');
  if(!Number.isSafeInteger(p.amount)||p.amount<=0)throw new Error('Enter an amount greater than zero');
  if(!METHODS.includes(p.method))throw new Error('Choose a payment method');
  if(p.method!=='CASH'&&!p.ref)throw new Error('Enter the reference number for '+METHOD_LABEL[p.method]+' payments');
  const bal=fin(o).bal;
  if(p.amount>bal)throw new Error('Amount is more than the outstanding balance of '+inr(bal));
  const pay={id:uid('p'),paymentNo:nextNo('payment','PAY'),invoiceId:inv.id,customerId:o.customerId,
    amount:p.amount,method:p.method,ref:p.ref||'',date:p.date||today(),at:new Date().toISOString(),
    by:p.by||'Staff',idem:p.idem,isReversal:false,reversesId:null};
  db.payments.push(pay);audit('Payment recorded',pay.paymentNo+' '+inr(pay.amount)+' on '+o.orderNo);
  return {payment:pay};
}
function placeOrder(d){
  const dup=db.orders.find(o=>o.idem===d.idem);if(dup)return {order:dup,dup:true};
  if(!db.customers.some(c=>c.id===d.customerId))throw new Error('Select a customer');
  if(!d.orderDate||!d.expectedDate)throw new Error('Enter both dates');
  if(d.expectedDate<d.orderDate)throw new Error('Delivery date cannot be before the order date');
  const t=totalsOf(priceItems(d.items),d.discountPaise,d.extraPaise);
  if(d.advancePaise<0||d.advancePaise>t.total)throw new Error('Advance cannot be more than the grand total');
  if(d.advancePaise>0&&d.method!=='CASH'&&!d.ref)throw new Error('Enter the reference number for '+METHOD_LABEL[d.method]+' payments');
  const now=new Date().toISOString();
  const order={id:uid('o'),orderNo:nextNo('order',db.settings.orderPrefix),customerId:d.customerId,
    status:d.status||'RECEIVED',orderDate:d.orderDate,expectedDate:d.expectedDate,
    instructions:d.instructions||'',notes:d.notes||'',items:t.items,subtotal:t.subtotal,
    discount:t.discount,extra:t.extra,total:t.total,by:d.by,createdAt:now,idem:d.idem||uid('k'),
    history:[{from:null,to:'RECEIVED',by:d.by,at:now,note:'Order created'}]};
  if(order.status!=='RECEIVED')order.history.push({from:'RECEIVED',to:order.status,by:d.by,at:now,note:''});
  db.orders.push(order);
  const inv={id:uid('i'),invoiceNo:nextNo('invoice',db.settings.invoicePrefix),orderId:order.id,total:t.total,issuedAt:now,issuedBy:d.by};
  db.invoices.push(inv);
  if(d.advancePaise>0)recordPayment({invoiceId:inv.id,amount:d.advancePaise,method:d.method,ref:d.ref,by:d.by,idem:order.idem+'-adv',date:d.orderDate});
  audit('Order created',order.orderNo+' for '+custName(d.customerId)+' '+inr(t.total),d.by);
  return {order};
}
function setStatus(id,to,note){
  if(!can('status'))return deny();
  const o=db.orders.find(x=>x.id===id);if(!o)throw new Error('Order not found');
  if(o.status==='CANCELLED')throw new Error('Cancelled orders cannot be changed');
  if(to===o.status)throw new Error('Order is already in that status');
  if(to==='CANCELLED')return cancelOrder(o);
  const from=o.status;o.status=to;
  o.history.push({from,to,by:ROLE_NAME[user.role],at:new Date().toISOString(),note:(note||'').trim()});
  audit('Status changed',o.orderNo+': '+SL[from]+' to '+SL[to]);
  save();toast('Status updated to '+SL[to]);render();
}
async function cancelOrder(o){
  if(!can('cancel'))throw new Error('Only managers can cancel orders');
  if(o.status==='DELIVERED')throw new Error('Delivered orders cannot be cancelled');
  const paid=fin(o).paid;
  if(paid>0)throw new Error('Reverse the '+inr(paid)+' already received before cancelling');
  const from=o.status;o.status='CANCELLED';
  o.history.push({from,to:'CANCELLED',by:ROLE_NAME[user.role],at:new Date().toISOString(),note:'Cancelled'});
  audit('Order cancelled',o.orderNo);
  await persist('Order cancelled');render();
}
async function reversePayment(id){
  if(!can('payments'))return deny();
  const p=db.payments.find(x=>x.id===id);if(!p||p.isReversal)return;
  if(db.payments.some(x=>x.reversesId===id))return toast('This payment is already reversed');
  const reason=await showDialog({title:'Reverse payment '+p.paymentNo,message:'This will create a reversal entry. Enter a reason to continue.',confirmText:'Reverse payment',danger:true,input:true,placeholder:'Reason for reversal'});
  if(!reason)return;
  db.payments.push({...p,id:uid('p'),paymentNo:nextNo('payment','PAY'),isReversal:true,reversesId:p.id,
    idem:uid('k'),date:today(),at:new Date().toISOString(),by:ROLE_NAME[user.role],ref:'Reversal: '+reason.trim()});
  audit('Payment reversed',p.paymentNo+' - '+reason.trim());
  await persist('Payment reversed');render();
}

function denied(){return '<div class="card">Your role does not have access to this page. Ask a manager or administrator.</div>';}
function notFound(what){return '<div class="card">'+what+' not found. <a href="#/">Go to dashboard</a></div>';}

function render(){
  if((location.hash||'').startsWith('#/track'))return renderTrack();
  const app=document.getElementById('app');
  if(!user){app.innerHTML=loginView();return;}
  const parts=(location.hash||'#/').slice(2).split('?')[0].split('/');
  const page=parts[0]||'dashboard', id=parts[1]||'', sub=parts[2]||'';
  let body;
  try{
    if(REQ[page]&&!can(REQ[page]))body=denied();
    else if(page==='customers')body=id==='new'?customerForm():(id?customerProfile(id):customersList());
    else if(page==='orders')body=id==='new'?wizard(sub||'') :(id?orderDetail(id):ordersList());
    else if(page==='pending')body=pending();
    else if(page==='invoices')body=id?invoiceDetail(id):invoicesList();
    else if(page==='products')body=products();
    else if(page==='payments')body=payments();
    else if(page==='outstanding')body=outstanding();
    else if(page==='reports')body=reports();
    else if(page==='settings')body=settings();
    else if(page==='more')body=more();
    else body=dashboard();
  }catch(e){body='<div class="card err">Something went wrong: '+esc(e.message)+'</div>';}
  app.innerHTML=shell(body);
  if(window.lucide)window.lucide.createIcons();
}

/* ---------- dashboard ---------- */
function bars(rows){
  const max=Math.max(1,...rows.map(r=>r.v));
  return rows.map(r=>'<div class="chart-row"><span>'+esc(r.l)+'</span><div class="bar"><i style="width:'+Math.round(r.v/max*100)+'%"></i></div><span style="text-align:right">'+esc(r.t)+'</span></div>').join('');
}
function kpi(l,v){return '<div class="card kpi"><div class="l">'+l+'</div><div class="v">'+v+'</div></div>';}
function orderCard(o){
  const f=fin(o);const od=isOverdue(o);
  return '<a class="card cardlink '+(od?'overdue':'')+'" href="#/orders/'+o.id+'">'+
    '<div class="row"><b>'+esc(o.orderNo)+'</b>'+statusBadge(o.status)+'</div>'+
    '<div>'+esc(custName(o.customerId))+'</div>'+
    '<div class="row muted"><span>Delivery '+fdate(o.expectedDate)+(od?' · <span class="err">Overdue</span>':'')+'</span><b style="color:#111">'+inr(o.total)+'</b></div>'+
    (f.bal>0&&o.status!=='CANCELLED'?'<div class="muted">Balance '+inr(f.bal)+'</div>':'')+'</a>';
}
function dashboard(){
  const t=today(),O=db.orders,live=O.filter(o=>o.status!=='CANCELLED');
  const c=s=>O.filter(o=>o.status===s).length;
  const pend=O.filter(isPending).sort((a,b)=>a.expectedDate.localeCompare(b.expectedDate));
  const sales=live.reduce((s,o)=>s+o.total,0);
  const out=db.customers.reduce((s,cu)=>s+custStats(cu.id).bal,0);
  const todayColl=db.payments.filter(p=>p.date===t).reduce((s,p)=>s+(p.isReversal?-p.amount:p.amount),0);
  const months=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);months.push({key:d.getFullYear()+'-'+p2(d.getMonth()+1),label:d.toLocaleString('en-IN',{month:'short'})});}
  const msales=months.map(m=>({l:m.label,v:live.filter(o=>o.orderDate.startsWith(m.key)).reduce((s,o)=>s+o.total,0)}));
  msales.forEach((r,i)=>r.t=inr(r.v));
  const mcount=months.map(m=>({l:m.label,v:O.filter(o=>o.orderDate.startsWith(m.key)).length}));
  mcount.forEach(r=>r.t=String(r.v));
  const dist=STATUSES.map(([k,l])=>({l:l.length>12?l.slice(0,11)+'…':l,v:c(k),t:String(c(k))}));
  const recent=O.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,5);
  return '<section class="dashboard-hero"><div class="dashboard-hero-copy"><div class="hero-kicker"><i data-lucide="sparkles"></i> OVERVIEW</div><h1>Good '+(new Date().getHours()<12?'morning':new Date().getHours()<17?'afternoon':'evening')+', '+ROLE_NAME[user.role]+'</h1><p>Here is what is happening at your laundry today.</p><div class="hero-actions">'+(can('orders')?'<a class="hero-primary" href="#/orders/new"><i data-lucide="plus"></i> Create new order</a>':'')+'<a class="hero-secondary" href="#/pending"><i data-lucide="truck"></i> View pending</a></div></div><div class="hero-art"><div class="hero-orbit orbit-one"></div><div class="hero-orbit orbit-two"></div><i data-lucide="washing-machine"></i></div></section>'+
    '<div class="section-heading"><div><h2>Business snapshot</h2><p>Key numbers at a glance</p></div><span class="today-chip"><i data-lucide="calendar-days"></i> '+fdate(t)+'</span></div>'+
    '<div class="grid4 dashboard-kpis">'+
      kpi('Total customers',db.customers.length)+kpi('Total orders',O.length)+
      kpi("Today's orders",O.filter(o=>o.orderDate===t).length)+kpi('Orders received',c('RECEIVED'))+
      kpi('In processing',c('WASHING')+c('PROCESSING')+c('IRONING'))+kpi('Ready for delivery',c('READY'))+
      kpi('Delivered',c('DELIVERED'))+kpi('Pending orders',pend.length)+
      kpi('Total sales',inr(sales))+kpi("Today's collection",inr(todayColl))+
      kpi('Outstanding balance',inr(out))+'</div>'+
    '<div class="section-heading charts-heading"><div><h2>Performance</h2><p>Sales and order activity</p></div></div>'+
    '<div class="two-col" style="margin-top:12px">'+
      '<div class="card"><h2 style="margin-top:0">Monthly sales</h2>'+bars(msales)+'</div>'+
      '<div class="card"><h2 style="margin-top:0">Order status distribution</h2>'+bars(dist)+'</div>'+
      '<div class="card"><h2 style="margin-top:0">Monthly order count</h2>'+bars(mcount)+'</div>'+
      '<div class="card"><h2 style="margin-top:0">Pending orders (by delivery date)</h2>'+(pend.slice(0,5).map(orderCard).join('')||'<div class="muted">No pending orders.</div>')+'</div>'+
    '</div>'+
    '<h2>Recent orders</h2>'+(recent.map(orderCard).join('')||'<div class="card muted">No orders yet.</div>');
}

const PFILT={today:o=>o.orderDate===today(),pending:isPending,processing:o=>['WASHING','PROCESSING','IRONING'].includes(o.status),
  ready:o=>o.status==='READY',overdue:isOverdue,delivered:o=>o.status==='DELIVERED'};
const PFILT_LABEL={today:"Today's orders",pending:'Pending',processing:'Processing',ready:'Ready for delivery',overdue:'Overdue',delivered:'Delivered'};
function pendListHTML(q){
  q=String(q||'').trim().toLowerCase();
  const list=db.orders.filter(o=>PFILT[pfilter](o)&&orderMatches(o,q)).sort((a,b)=>a.expectedDate.localeCompare(b.expectedDate));

}

/* ---------- wizard: new order ---------- */
function startDraft(preset){
  draft={step:1,preset:preset||'',customerId:preset||'',items:[],addProd:'',addQty:'',
    orderDate:today(),expected:addDays(today(),2),discount:'',extra:'',advance:'',method:'CASH',ref:'',instructions:'',idem:uid('k')};
  const first=db.products.find(p=>p.active);if(first)draft.addProd=first.id;
}
function readStep(){document.querySelectorAll('[data-d]').forEach(el=>{draft[el.dataset.d]=el.value;});}
function currentTotals(){
  return totalsOf(priceItems(draft.items),parseRupees(draft.discount),parseRupees(draft.extra));
}
function wizard(preset){
  if(!can('orders'))return denied();
  if(preset&&(!draft||draft.preset!==preset))startDraft(preset);
  if(!draft)startDraft('');
  const steps=['Customer','Items','Details','Payment','Review'];
  const bar='<div class="steps">'+steps.map((_,i)=>'<span class="'+(i+1<=draft.step?'on':'')+'"></span>').join('')+'</div>';
  let inner='';
  if(draft.step===1){
    inner='<h2 style="margin-top:0">Step 1: Select or create customer</h2>'+
      '<label>Customer</label><select data-d="customerId"><option value="">Choose a customer</option>'+
      db.customers.map(c=>'<option value="'+c.id+'" '+(draft.customerId===c.id?'selected':'')+'>'+esc(c.name)+' · '+esc(c.mobile)+'</option>').join('')+'</select>'+
      '<details class="card" style="margin-top:12px"><summary><b>+ Create new customer</b></summary>'+
      '<form data-form="wcust" style="margin-top:8px"><label>Name *</label><input name="name" required><label>Mobile * (10 digits)</label><input name="mobile" inputmode="tel" required><label>Address</label><input name="address"><button class="btn sec block" style="margin-top:12px">Save and select</button></form></details>';
  }
  if(draft.step===2){
    const actives=db.products.filter(p=>p.active);
    let sub=0;
    const list=draft.items.map((it,i)=>{const p=db.products.find(x=>x.id===it.productId);const a=lineAmount(it.qtyMilli,p.ratePaise);sub+=a;
      return '<div class="line"><div><b>'+esc(p.name)+'</b><div class="muted">'+qtyText(it.qtyMilli,p.unit)+' '+p.unit+' × '+inr(p.ratePaise)+'</div></div><div style="text-align:right"><b>'+inr(a)+'</b><div><button class="btn danger" style="min-height:36px;padding:0 10px;margin-top:4px" data-act="wremove" data-i="'+i+'">Remove</button></div></div></div>';}).join('');
    inner='<h2 style="margin-top:0">Step 2: Add laundry items</h2>'+
      '<label>Product / service</label><select data-d="addProd">'+actives.map(p=>'<option value="'+p.id+'" '+(draft.addProd===p.id?'selected':'')+'>'+esc(p.name)+' · '+inr(p.ratePaise)+'/'+p.unit+'</option>').join('')+'</select>'+
      '<label>Quantity (KG or PCS)</label><input data-d="addQty" inputmode="decimal" value="'+esc(draft.addQty)+'" placeholder="e.g. 5 or 2.5 for KG, 3 for pieces">'+
      '<button class="btn sec block" style="margin-top:12px" data-act="wadd">+ Add item</button>'+
      '<h2>Items</h2><div class="card">'+(list||'<div class="muted">No items yet.</div>')+'<div class="line"><b>Subtotal</b><b>'+inr(sub)+'</b></div></div>';
  }
  if(draft.step===3){
    inner='<h2 style="margin-top:0">Step 3: Order details</h2>'+
      '<label>Order date</label><input type="date" data-d="orderDate" value="'+esc(draft.orderDate)+'">'+
      '<label>Expected delivery date</label><input type="date" data-d="expected" value="'+esc(draft.expected)+'">'+
      '<label>Discount in ₹</label><input data-d="discount" inputmode="decimal" value="'+esc(draft.discount)+'" placeholder="0">'+
      '<label>Additional charges in ₹ (e.g. express, pickup)</label><input data-d="extra" inputmode="decimal" value="'+esc(draft.extra)+'" placeholder="0">'+
      '<label>Special instructions</label><textarea data-d="instructions" rows="2">'+esc(draft.instructions)+'</textarea>';
  }
  if(draft.step===4){
    let t=null,err='';try{t=currentTotals();}catch(e){err=e.message;}
    inner='<h2 style="margin-top:0">Step 4: Payment</h2>'+
      (t?'<div class="card"><div class="line"><span>Subtotal</span><b>'+inr(t.subtotal)+'</b></div><div class="line"><span>Discount</span><b>- '+inr(t.discount)+'</b></div><div class="line"><span>Additional charges</span><b>'+inr(t.extra)+'</b></div><div class="line"><span>Grand total</span><b>'+inr(t.total)+'</b></div></div>':'<div class="card err">'+esc(err)+'</div>')+
      '<label>Advance paid in ₹</label><input data-d="advance" inputmode="decimal" value="'+esc(draft.advance)+'" placeholder="0">'+
      '<label>Payment method</label><select data-d="method">'+METHODS.map(m=>'<option value="'+m+'" '+(draft.method===m?'selected':'')+'>'+METHOD_LABEL[m]+'</option>').join('')+'</select>'+

  }
  if(draft.step===5){

/* ---------- reports ---------- */
function reports(){
  if(!rFrom){rFrom=today().slice(0,8)+'01';rTo=today();}
  const inR=d=>d>=rFrom&&d<=rTo;
  const live=db.orders.filter(o=>o.status!=='CANCELLED'&&inR(o.orderDate));
  const cancelled=db.orders.filter(o=>o.status==='CANCELLED'&&inR(o.orderDate));
  const pays=db.payments.filter(p=>inR(p.date));
  const sales=live.reduce((s,o)=>s+o.total,0);
  const collected=pays.reduce((s,p)=>s+(p.isReversal?-p.amount:p.amount),0);
  const outNow=db.customers.reduce((s,c)=>s+custStats(c.id).bal,0);
  const daily={};live.forEach(o=>{daily[o.orderDate]=(daily[o.orderDate]||0)+o.total;});
  const prod={};live.forEach(o=>o.items.forEach(i=>{prod[i.name]=(prod[i.name]||0)+i.amount;}));
  const cust={};live.forEach(o=>{const n=custName(o.customerId);cust[n]=(cust[n]||0)+o.total;});
  const sc=STATUSES.map(([k,l])=>[l,db.orders.filter(o=>o.status===k&&inR(o.orderDate)).length]);
  const list=obj=>Object.entries(obj).sort((a,b)=>b[1]-a[1]).map(([k,v])=>'<div class="line"><span>'+esc(k)+'</span><b>'+inr(v)+'</b></div>').join('')||'<div class="muted">No data in this range.</div>';
  return '<h1>Reports</h1>'+
    '<form class="card" data-form="report"><div class="grid4" style="grid-template-columns:1fr 1fr"><div><label>From</label><input type="date" name="from" value="'+rFrom+'"></div><div><label>To</label><input type="date" name="to" value="'+rTo+'"></div></div><button class="btn sec block" style="margin-top:12px">Apply date range</button></form>'+
    '<div class="grid4">'+kpi('Sales',inr(sales))+kpi('Orders',live.length)+kpi('Collections',inr(collected))+kpi('Outstanding now',inr(outNow))+'</div>'+
    '<div class="row" style="margin-top:12px"><button class="btn ghost" data-act="csv" data-k="orders">Export orders (CSV)</button><button class="btn ghost" data-act="csv" data-k="payments">Export payments (CSV)</button></div>'+
    '<h2>Daily sales</h2><div class="card">'+list(daily)+'</div>'+
    '<h2>Product-wise sales</h2><div class="card">'+list(prod)+'</div>'+
    '<h2>Customer-wise sales</h2><div class="card">'+list(cust)+'</div>'+
    '<h2>Order status</h2><div class="card">'+sc.map(([l,n])=>'<div class="line"><span>'+l+'</span><b>'+n+'</b></div>').join('')+'</div>'+
    '<h2>Cancelled orders</h2><div class="card">'+(cancelled.map(o=>'<div class="line"><span>'+esc(o.orderNo)+' · '+esc(custName(o.customerId))+'</span><b>'+inr(o.total)+'</b></div>').join('')||'<div class="muted">None in this range.</div>')+'</div>';
}
function toCSV(rows){return rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');}
function exportCSV(kind){
  if(!can('reports'))return deny();
  const inR=d=>d>=rFrom&&d<=rTo;
  let rows;
  if(kind==='orders'){
    rows=[['Order No','Order Date','Customer','Status','Total (Rs)','Paid (Rs)','Balance (Rs)']];
    db.orders.filter(o=>inR(o.orderDate)).forEach(o=>{const f=fin(o);rows.push([o.orderNo,o.orderDate,custName(o.customerId),SL[o.status],(o.total/100).toFixed(2),(f.paid/100).toFixed(2),(f.bal/100).toFixed(2)]);});
  }else{
    rows=[['Payment No','Date','Customer','Method','Reference','Type','Amount (Rs)']];
    db.payments.filter(p=>inR(p.date)).forEach(p=>rows.push([p.paymentNo,p.date,custName(p.customerId),METHOD_LABEL[p.method],p.ref,p.isReversal?'Reversal':'Payment',((p.isReversal?-p.amount:p.amount)/100).toFixed(2)]));
  }
  const blob=new Blob([toCSV(rows)],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=kind+'-'+rFrom+'-to-'+rTo+'.csv';a.click();
  toast('CSV downloaded');
}

function doTrack(no,mob){
  const res=document.getElementById('trackRes');if(!res)return;
  const o=db.orders.find(x=>x.orderNo===String(no||'').trim().toUpperCase());
  const digits=String(mob||'').replace(/\D/g,'');
  const c=o&&db.customers.find(x=>x.id===o.customerId);
  if(!o||!c||c.mobile!==digits.slice(-10)){res.innerHTML='<div class="card">No order matches these details. Check the order number and your registered mobile.</div>';return;}
  const f=fin(o);const idx=FLOW.indexOf(o.status);
  const steps=o.status==='CANCELLED'?'<p class="err">This order was cancelled. Please contact the shop.</p>':
    '<ul class="tl">'+FLOW.map((s,i)=>'<li class="'+(i<idx?'done':i===idx?'done cur':'')+'"><i></i>'+esc(SL[s])+'</li>').join('')+'</ul>';
  res.innerHTML='<div class="card"><div class="row"><b>'+esc(o.orderNo)+'</b>'+statusBadge(o.status)+'</div>'+
    '<div class="muted">Ordered '+fdate(o.orderDate)+' · Expected delivery '+fdate(o.expectedDate)+'</div>'+
    '<h2>Progress</h2>'+steps+
    '<h2>Items</h2>'+o.items.map(i=>'<div class="line"><span>'+esc(i.name)+' ('+qtyText(i.qtyMilli,i.unit)+' '+i.unit+')</span><span>'+inr(i.amount)+'</span></div>').join('')+
    '<div class="line"><b>Grand total</b><b>'+inr(o.total)+'</b></div>'+
    '<div class="line"><span>Payment status</span>'+payBadge(f.ps)+'</div>'+
    '<div class="line"><span>Outstanding</span><b class="'+(f.bal>0?'err':'')+'">'+inr(f.bal)+'</b></div></div>';
}

/* ---------- actions & forms ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  e.preventDefault();
  const a=el.dataset.act;
  if(el.matches('[data-drawer-link]'))closeDrawer();
  safe(()=>act(a,el));
});
async function act(a,el){
  switch(a){
    case 'drawer-open':document.body.classList.add('drawer-open');break;
    case 'drawer-close':closeDrawer();break;
    case 'login':{
      const r=el.dataset.r;if(!PERMS[r])return;
      user={role:r};localStorage.setItem(UKEY,r);
      location.hash='#/';render();break;}
    case 'logout':
      closeDrawer();user=null;localStorage.removeItem(UKEY);location.hash='#/';render();break;
    case 'ofilter':ofilter=el.dataset.v;render();break;
    case 'pfilter':pfilter=el.dataset.v;render();break;
    case 'outonly':outOnly=!outOnly;render();break;
    case 'print':{
      const d=document.getElementById('docArea');
      if(d)d.classList.toggle('thermal',el.dataset.t==='1');
      window.print();break;}
    case 'qstatus':setStatus(el.dataset.id,el.dataset.to,'');break;
    case 'cancel':{
      if(!can('cancel'))return deny();
      if(!await confirmAction('This order will be cancelled. This action cannot be undone.','Cancel this order?'))return;
      await cancelOrder(db.orders.find(o=>o.id===el.dataset.id));break;}
    case 'rev':if(!can('payments'))return deny();await reversePayment(el.dataset.id);break;
    case 'ptoggle':{
      if(!can('products'))return deny();
      const p=db.products.find(x=>x.id===el.dataset.id);if(!p)return;
      p.active=!p.active;audit('Product '+(p.active?'activated':'deactivated'),p.name);save();render();break;}
    case 'csv':exportCSV(el.dataset.k);break;
    case 'reset':
      if(user.role!=='ADMIN')return deny();
      if(!await confirmAction('All current demo records will be replaced with the sample data.','Reset demo data?'))return;
      seed();save();toast('Demo data reset');render();break;
    case 'wnext':wnext();break;
    case 'wback':readStep();draft.step=Math.max(1,draft.step-1);render();break;
    case 'wadd':{
      readStep();
      const qty=parseQty(draft.addQty);
      priceItems([{productId:draft.addProd,qtyMilli:qty}]);
      draft.items.push({productId:draft.addProd,qtyMilli:qty});
      draft.addQty='';render();break;}
    case 'wremove':readStep();draft.items.splice(Number(el.dataset.i),1);render();break;
    case 'wsave':await wsave();break;
    default:break;
  }
}
function wnext(){
  readStep();const s=draft.step;
  if(s===1&&!draft.customerId)throw new Error('Select or create a customer');
  if(s===2&&!draft.items.length)throw new Error('Add at least one item');
  if(s===3){
    if(!draft.orderDate||!draft.expected)throw new Error('Enter both dates');
    if(draft.expected<draft.orderDate)throw new Error('Delivery date cannot be before the order date');
    parseRupees(draft.discount);parseRupees(draft.extra);
    currentTotals();
  }
  if(s===4){
    const t=currentTotals();const adv=parseRupees(draft.advance);
    if(adv>t.total)throw new Error('Advance cannot be more than the grand total');
    if(adv>0&&draft.method!=='CASH'&&!draft.ref.trim())throw new Error('Enter the reference number for non-cash payments');
  }
  draft.step=s+1;render();
}
async function wsave(){
  readStep();
  const res=placeOrder({customerId:draft.customerId,orderDate:draft.orderDate,expectedDate:draft.expected,
    items:draft.items,discountPaise:parseRupees(draft.discount),extraPaise:parseRupees(draft.extra),
    advancePaise:parseRupees(draft.advance),method:draft.method,ref:draft.ref.trim(),
    instructions:draft.instructions.trim(),notes:'',by:ROLE_NAME[user.role],idem:draft.idem,status:'RECEIVED'});
  const ok=await persist(res.dup?'Order already saved':'Order '+res.order.orderNo+' saved');
  if(!ok){render();return;}
  draft=null;
  location.hash='#/orders/'+res.order.id;render();
}

document.addEventListener('submit',e=>{
  const f=e.target;if(!f.dataset||!f.dataset.form)return;
  e.preventDefault();
  safe(()=>handleForm(f.dataset.form,f,new FormData(f)));
});
async function handleForm(name,f,fd){
  switch(name){
    case 'customer':{
      const c=addCustomer(Object.fromEntries(fd));save();toast('Customer '+c.code+' saved');location.hash='#/customers/'+c.id;render();break;}
    case 'wcust':{
      const c=addCustomer(Object.fromEntries(fd));readStep();draft.customerId=c.id;draft.step=2;save();toast('Customer '+c.code+' added');render();break;}
    case 'product':{
      addProduct(Object.fromEntries(fd));save();toast('Product added');render();break;}
    case 'rate':{
      if(!can('products'))return deny();
      const p=db.products.find(x=>x.id===f.dataset.id);
      const r=parseRupees(fd.get('rate'));if(r<=0)throw new Error('Rate must be greater than zero');
      if(r===p.ratePaise){toast('Rate is unchanged');return;}
      p.history.push({old:p.ratePaise,new:r,at:new Date().toISOString(),by:ROLE_NAME[user.role]});
      audit('Rate changed',p.name+' '+inr(p.ratePaise)+' to '+inr(r));
      p.ratePaise=r;save();toast('Rate updated. Past invoices are not affected.');render();break;}
    case 'status':setStatus(f.dataset.id,fd.get('to'),fd.get('note'));break;
    case 'pay':{
      if(!can('payments'))return deny();
      const r=recordPayment({invoiceId:fd.get('inv'),amount:parseRupees(fd.get('amount')),method:fd.get('method'),
        ref:String(fd.get('ref')||'').trim(),by:ROLE_NAME[user.role],idem:fd.get('idem')});
      if(r.dup){toast('This payment was already recorded');}
      else{
        const ok=await persist('Payment '+r.payment.paymentNo+' of '+inr(r.payment.amount)+' recorded');
        if(ok)payIdem=uid('k');
      }
      render();break;}
    case 'company':{
      if(!can('settings')&&user.role!=='ADMIN'&&user.role!=='MANAGER')return deny();
      db.settings.name=String(fd.get('name')||'').trim()||db.settings.name;
      db.settings.address=String(fd.get('address')||'').trim();
      db.settings.phone=String(fd.get('phone')||'').trim();
      audit('Company profile updated','');save();toast('Profile saved');render();break;}
    case 'report':rFrom=fd.get('from')||rFrom;rTo=fd.get('to')||rTo;render();break;
    case 'track':doTrack(fd.get('o'),fd.get('m'));break;
    default:break;
  }
}
document.addEventListener('input',e=>{
  const kind=e.target.dataset.live;if(!kind)return;
  const target=document.getElementById(e.target.dataset.target);if(!target)return;
  const v=e.target.value;
  if(kind==='cust')target.innerHTML=custListHTML(v);
  else if(kind==='ord')target.innerHTML=ordListHTML(v);
  else if(kind==='inv')target.innerHTML=invListHTML(v);
  else if(kind==='pend')target.innerHTML=pendListHTML(v);
});

/* ---------- start ---------- */
async function boot(){
  const app=document.getElementById('app');
  app.innerHTML='<div class="login"><div class="card"><h1>Laundry Manager</h1><p class="muted">Connecting to database…</p></div></div>';
  try{
    const snap=await getDoc(DOC_REF);
    if(snap.exists()){db=snap.data();}
    else{seed();await setDoc(DOC_REF,cleanData());}
  }catch(err){
    console.error(err);
    app.innerHTML='<div class="login"><div class="card"><h1>Cannot connect</h1><p class="muted">The app could not reach the database. Check your internet connection and the Firestore setup, then reload the page.</p><button class="btn block" onclick="location.reload()">Reload</button></div></div>';
    return;
  }
  const r=localStorage.getItem(UKEY);if(r&&PERMS[r])user={role:r};
  onSnapshot(DOC_REF,s=>{
    if(s.metadata.hasPendingWrites||!s.exists())return;
    db=s.data();render();
  },err=>console.error(err));
  window.addEventListener('hashchange',()=>{closeDrawer();render();});
  render();
}
boot();
</script>
